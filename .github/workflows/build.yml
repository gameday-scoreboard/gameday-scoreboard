name: Build

on:
  pull_request:
  push:
    branches: [main, beta, dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notes:
    # Release notes come from CHANGELOG.md. On a tag the section must exist.
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.notes.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      # The manifest takes its version from the YAML, not the tag, so a tag
      # whose bump was forgotten would publish the old number. Fail before
      # anything builds.
      - name: Tag matches the firmware version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^  version: "\(.*\)"$/\1/p' firmware/gameday-common.yaml)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=firmware/gameday-common.yaml::version is '$v' but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - id: notes
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python scripts/release_notes.py "${GITHUB_REF_NAME}" > notes.md
            echo "summary=$(python scripts/release_notes.py "${GITHUB_REF_NAME}" --summary)" >> "$GITHUB_OUTPUT"
          else
            echo "Development build" > notes.md
            echo "summary=Development build" >> "$GITHUB_OUTPUT"
          fi
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  branch-rules:
    # Work lands in dev. beta only takes changes promoted from dev, and main
    # (what customers run) only takes changes promoted from beta; only a tag
    # on main publishes to the flasher and the panels. The
    # checks are steps, not job conditions, so the job passes (rather than
    # skips) when they don't apply and build still runs.
    name: Branch rules
    runs-on: ubuntu-latest
    steps:
      - name: PRs into beta come from dev
        if: github.event_name == 'pull_request' && github.base_ref == 'beta'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::beta only takes PRs from dev (this one is from $HEAD_REPO:$HEAD_REF). Target dev instead."
            exit 1
          fi
      - name: PRs into main come from beta
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "beta" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::main only takes PRs from beta (this one is from $HEAD_REPO:$HEAD_REF). Target beta instead."
            exit 1
          fi
      - uses: actions/checkout@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          fetch-depth: 0
      - name: Release tags are on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Promote beta to main, then tag main."
            exit 1
          fi

  build:
    # One firmware for every panel count since v0.6.0, built once per
    # controller pinout. The variant names the manifest folder on the flasher
    # site, and the updater on a panel only ever looks in its own folder.
    name: Build ${{ matrix.variant }}
    needs: [notes, branch-rules]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: moonhub75
            yaml: firmware/gameday.yaml
          - variant: scoreboard75
            yaml: firmware/gameday-scoreboard75.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        id: esphome
        uses: esphome/build-action@v7
        with:
          yaml-file: ${{ matrix.yaml }}
          version: "2026.8.2"
          complete-manifest: true
          release-summary: ${{ needs.notes.outputs.summary }}
          release-url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
      - name: Stage output under a stable folder name
        run: |
          mkdir -p out
          cp -r "${{ steps.esphome.outputs.name }}" out/${{ matrix.variant }}
          ls -R out
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: out

  build-beta:
    # Early warning: the next ESPHome, allowed to fail. Nothing is published
    # from this job.
    name: Build ${{ matrix.variant }} (ESPHome beta)
    needs: notes
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: moonhub75
            yaml: firmware/gameday.yaml
          - variant: scoreboard75
            yaml: firmware/gameday-scoreboard75.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: esphome/build-action@v7
        with:
          yaml-file: ${{ matrix.yaml }}
          version: beta

  host-tests:
    name: Parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C tests

  web-tests:
    # The device page (firmware/web/bundle.js) in Chromium against
    # tests/web/mock_device.py.
    name: Device page tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/web
    steps:
      - uses: actions/checkout@v4
      - name: bundle.js is built from the current app.js
        run: |
          python3 ../../scripts/build_web.py
          git diff --exit-code -- ../../firmware/web/bundle.js || {
            echo "::error::firmware/web/bundle.js is out of date. Run python scripts/build_web.py and commit it."
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  publish:
    name: Publish flasher and release
    needs: [build, host-tests, web-tests, notes]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site/firmware
          # docs/site/. (not docs/site/*) so .well-known/ is copied too.
          cp -r docs/site/. site/
          cp -r artifacts/* site/firmware/
          sed -i "s/__VERSION__/${GITHUB_REF_NAME}/g" site/index.html
          ls -R site
          bash scripts/check_site_firmware.sh site "$GITHUB_REF_NAME"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Create the release with notes and binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          # MoonHub75 keeps the unsuffixed factory bin name it has always had.
          f=$(ls artifacts/moonhub75/*.factory.bin | head -1)
          cp "$f" "release/gameday-scoreboard-${GITHUB_REF_NAME}.factory.bin"
          f=$(ls artifacts/scoreboard75/*.factory.bin | head -1)
          cp "$f" "release/gameday-scoreboard-${GITHUB_REF_NAME}-scoreboard75.factory.bin"
          ASSETS="release/gameday-scoreboard-${GITHUB_REF_NAME}.factory.bin release/gameday-scoreboard-${GITHUB_REF_NAME}-scoreboard75.factory.bin"
          # Also zip each variant's manifest folder (manifest.json plus the
          # OTA and factory bins it references, with relative paths that
          # resolve the same wherever the folder lands) so site.yml can
          # rebuild site/firmware/<variant>/ from a release asset instead of
          # a Build artifact, which expires after 90 days.
          for v in moonhub75 scoreboard75; do
            (cd artifacts && zip -r "../release/firmware-$v.zip" "$v")
            ASSETS="$ASSETS release/firmware-$v.zip"
          done
          PREV=$(gh release list --exclude-drafts --limit 20 --json tagName --jq "[.[].tagName | select(. != \"${GITHUB_REF_NAME}\")][0]")
          {
            cat notes/notes.md
            echo
            echo "Install or update from the [flasher page](https://gamedayscoreboard.app/), or let a panel already running v0.2.2 or later update itself from its device page."
            if [ -n "$PREV" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            fi
          } > release/body.md
          gh release create "$GITHUB_REF_NAME" $ASSETS --title "$GITHUB_REF_NAME" --notes-file release/body.md || \
          { gh release upload "$GITHUB_REF_NAME" $ASSETS --clobber; gh release edit "$GITHUB_REF_NAME" --notes-file release/body.md; }
