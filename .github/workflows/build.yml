name: Build

on:
  pull_request:
  push:
    branches: [main, beta, dev]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      install_now:
        description: >-
          Beta channel only (run on beta): panel names, like gameday-aba970,
          or "all". Those bar panels install this beta within 15 minutes
          instead of at night.
        type: string
        default: ""

# Read-only by default. Only publish writes (the release and Pages), and it
# asks for that itself.
permissions:
  contents: read

# The ESPHome every build job uses (the ESPHome beta job aside). dev and beta
# may pin an ESPHome beta; main and release tags need a final release, which
# Branch rules checks.
env:
  ESPHOME_VERSION: "2026.10.0b3"

# A newer push to the same ref cancels the older run. That stays on for dev
# too: a merge that lands within a few minutes of the last one leaves the
# earlier merge commit with a cancelled run and no artifacts, but dev's newest
# commit always builds in full, and every PR had its own green run before it
# merged. To get firmware for a cancelled commit, rerun it with
# `gh run rerun <run id>`. Tags are their own refs, so a release never cancels.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notes:
    # Release notes come from CHANGELOG.md. On a tag the section must exist.
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.notes.outputs.summary }}
    steps:
      - uses: actions/checkout@v7
      # The manifest takes its version from the YAML, not the tag, so a tag
      # whose bump was forgotten would publish the old number. Fail before
      # anything builds.
      - name: Tag matches the firmware version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^  version: "\(.*\)"$/\1/p' firmware/gameday-common.yaml)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=firmware/gameday-common.yaml::version is '$v' but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - id: notes
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python scripts/release_notes.py "${GITHUB_REF_NAME}" > notes.md
            echo "summary=$(python scripts/release_notes.py "${GITHUB_REF_NAME}" --summary)" >> "$GITHUB_OUTPUT"
          else
            echo "Development build" > notes.md
            echo "summary=Development build" >> "$GITHUB_OUTPUT"
          fi
          cat notes.md
      # The site's /changelog page is rendered at deploy; fail here first.
      - name: Changelog page renders
        run: |
          cp docs/site/changelog/index.html /tmp/changelog.html
          python3 scripts/release_notes.py --page /tmp/changelog.html
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md

  branch-rules:
    # Work lands in dev. beta only takes changes promoted from dev, and main
    # (what customers run) only takes changes promoted from beta; only a tag
    # on main publishes to the flasher and the panels, and main builds only on
    # a final ESPHome release. The checks are steps, not job conditions, so the job passes (rather than
    # skips) when they don't apply and build still runs.
    name: Branch rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The override label on a promotion PR.
      pull-requests: read
    steps:
      - name: PRs into beta come from dev
        if: github.event_name == 'pull_request' && github.base_ref == 'beta'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::beta only takes PRs from dev (this one is from $HEAD_REPO:$HEAD_REF). Target dev instead."
            exit 1
          fi
      - name: PRs into main come from beta
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "beta" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::main only takes PRs from beta (this one is from $HEAD_REPO:$HEAD_REF). Target beta instead."
            exit 1
          fi
      # Customers run main, so main and release tags build only on a final
      # ESPHome release, like 2026.10.0. The maintainer's esphome-beta-ok
      # label lets one promotion PR through, and the tag on its merge. Labels
      # come from the API, not the event, so re-running this job after adding
      # the label sees it.
      - name: main builds on a final ESPHome
        if: (github.event_name == 'pull_request' && github.base_ref == 'main') || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          final='^[0-9]+\.[0-9]+\.[0-9]+$'
          # Check the pattern itself first, so an edit can't quietly weaken it.
          for v in 2026.10.0 2026.9.12; do
            grep -qE "$final" <<< "$v" || { echo "::error::The final-release pattern misses $v"; exit 1; }
          done
          for v in 2026.10.0b3 2026.10.0-dev beta latest dev; do
            grep -qE "$final" <<< "$v" && { echo "::error::The final-release pattern wrongly takes $v"; exit 1; }
          done
          if grep -qE "$final" <<< "$ESPHOME_VERSION"; then
            echo "ESPHome $ESPHOME_VERSION is a final release."
            exit 0
          fi
          if [ -n "$PR" ]; then
            prs=$PR
          else
            # A tag: the promotion PR that merged this commit into main.
            prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                    --jq '.[] | select(.base.ref == "main" and .merged_at != null) | .number')
          fi
          for n in $prs; do
            ok=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n" --jq '.labels[] | select(.name == "esphome-beta-ok") | .name')
            if [ -n "$ok" ]; then
              echo "::warning::ESPHome $ESPHOME_VERSION is a beta. Building it for main anyway: PR #$n has the esphome-beta-ok label."
              exit 0
            fi
          done
          echo "::error file=.github/workflows/build.yml::ESPHOME_VERSION is $ESPHOME_VERSION, a beta. main and release tags build only on a final ESPHome release: move the pin to a final release on dev, then promote again. To ship this beta anyway, the maintainer adds the esphome-beta-ok label to the promotion PR and re-runs this job."
          exit 1
      - uses: actions/checkout@v7
        with:
          # Tags need history for the main check. The quotes matter: a bare 0
          # is falsy and would fall through to 1.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
      # The repo is public. Handoffs, session notes, plans, reviews and specs
      # are kept privately and must never land here, even by accident.
      - name: No private notes
        run: |
          pattern='(^|/)([^/]*HANDOFF[^/]*|[^/]*SESSION[^/]*|CLAUDE\.local)\.md$|(^|/)(plans|reviews|specs|notes)/|^docs/superpowers/'
          # Check the pattern itself first, so an edit can't quietly weaken it.
          for f in firmware-HANDOFF.md HANDOFF.md SESSION-2026-10-14.md CLAUDE.local.md \
                   firmware/CLAUDE.local.md plans/x.md reviews/x.md specs/x.md notes/x.md \
                   docs/plans/x.md docs/superpowers/x.md; do
            grep -qE "$pattern" <<< "$f" || { echo "::error::The private-notes pattern misses $f"; exit 1; }
          done
          for f in CLAUDE.md README.md docs/release-notes.md firmware/plans.yaml specs.md; do
            grep -qE "$pattern" <<< "$f" && { echo "::error::The private-notes pattern wrongly catches $f"; exit 1; }
          done
          found=$(git ls-files | grep -E "$pattern" || true)
          if [ -n "$found" ]; then
            echo "$found" | while read -r f; do echo "::error file=$f::Private notes don't belong in this public repo. Remove the file."; done
            exit 1
          fi
      - name: Release tags are on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Promote beta to main, then tag main."
            exit 1
          fi

  build:
    # One firmware for every panel count since v0.6.0, built once per
    # controller pinout. The variant names the manifest folder on the flasher
    # site, and the updater on a panel only ever looks in its own folder.
    # moonhub75-2panel is the same firmware booting two panels wide, for the
    # DIY installer only; it updates from moonhub75's folder.
    name: Build ${{ matrix.variant }}
    needs: [notes, branch-rules]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: moonhub75
            yaml: firmware/gameday.yaml
          - variant: moonhub75-2panel
            yaml: firmware/gameday-2panel.yaml
          - variant: scoreboard75
            yaml: firmware/gameday-scoreboard75.yaml
    steps:
      - uses: actions/checkout@v7
      # On the beta branch this is also the beta channel for panels with
      # "Follow beta" on: the same "-beta.<run>" version as the bar build of
      # this run, and publish-beta puts it on the site.
      - name: Beta version and summary
        id: beta
        env:
          NOTES: ${{ needs.notes.outputs.summary }}
        run: |
          set -euo pipefail
          summary=$NOTES
          # The release's section of the site's changelog, which this tag's deploy renders.
          url="https://install.gameday-scoreboard.com/changelog/#$GITHUB_REF_NAME"
          if [ "$GITHUB_REF" = refs/heads/beta ]; then
            v=$(sed -n 's/^  version: "\(.*\)"$/\1/p' firmware/gameday-common.yaml)
            v="$v-beta.$GITHUB_RUN_NUMBER"
            sed -i "s/^  version: \".*\"$/  version: \"$v\"/" firmware/gameday-common.yaml
            summary="Beta $v from ${GITHUB_SHA::7}."
            url="https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          fi
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Build firmware
        id: esphome
        uses: esphome/build-action@v7
        with:
          yaml-file: ${{ matrix.yaml }}
          version: ${{ env.ESPHOME_VERSION }}
          complete-manifest: true
          release-summary: ${{ steps.beta.outputs.summary }}
          release-url: ${{ steps.beta.outputs.url }}
      - name: Stage output under a stable folder name
        run: |
          mkdir -p out
          cp -r "${{ steps.esphome.outputs.name }}" out/${{ matrix.variant }}
          ls -R out
      # The installer would say "Installing bharvey88.gameday-scoreboard".
      - name: Product name in the manifest
        run: ./scripts/set_manifest_name.sh out
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.variant }}
          path: out
      # For the budget job: the OTA image's size and the ELF's static
      # internal RAM. The name stays outside publish's firmware-* pattern.
      - name: Measure flash and static RAM
        run: python3 scripts/size_budget.py firmware out/${{ matrix.variant }} ${{ matrix.variant }} sizes/${{ matrix.variant }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: sizes-${{ matrix.variant }}
          path: sizes

  budget:
    # Flash, static internal RAM and the memory each ESPN read takes, against
    # firmware/budget.json. A pull request into dev also fails when one figure
    # grows more than the file's max_growth against dev's last build. A
    # promotion carries many changes at once, so it only gets the budget.
    # The job summary has the table.
    name: Size budget
    needs: [build, host-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: sizes-*
          path: sizes
      - name: Figures from the base branch
        id: base
        if: github.event_name == 'pull_request' && github.base_ref == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          # The base commit's own run first, then the base branch's newest
          # runs: a push that lands while dev builds cancels the older run,
          # sometimes before it uploaded its figures.
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$BASE_SHA&event=push&per_page=5" \
                   --jq '.workflow_runs[] | "\(.id) \(.head_sha)"' || true)
          runs="$runs
          $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=$BASE_REF&event=push&per_page=10" \
              --jq '.workflow_runs[] | "\(.id) \(.head_sha)"' || true)"
          while read -r id sha; do
            [ -n "$id" ] || continue
            rm -rf base
            if gh run download "$id" -p 'sizes-*' -D base 2>/dev/null && [ -n "$(ls -A base 2>/dev/null)" ]; then
              echo "label=$BASE_REF ${sha::7} (run $id)" >> "$GITHUB_OUTPUT"
              echo "Base figures from run $id ($sha)"
              exit 0
            fi
          done <<< "$runs"
          echo "::warning::No figures from a $BASE_REF build found, so only the budget is checked, not the growth."
      - name: Check the budget
        env:
          BASE_LABEL: ${{ steps.base.outputs.label }}
        run: python3 scripts/size_budget.py check sizes --base base --base-label "$BASE_LABEL"

  build-demo:
    # The demo build (firmware/pages/demo.yaml) for showing panels in bars and
    # sending them to creators. A downloadable file on the run and nothing
    # more: the artifact name does not match publish's firmware-* pattern, so
    # it never reaches the flasher site or a manifest, and tags skip it.
    name: Build ${{ matrix.variant }} demo
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: branch-rules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: moonhub75
            yaml: firmware/gameday-demo.yaml
          - variant: scoreboard75
            yaml: firmware/gameday-scoreboard75-demo.yaml
    steps:
      - uses: actions/checkout@v7
      - name: Build firmware
        id: esphome
        uses: esphome/build-action@v7
        with:
          yaml-file: ${{ matrix.yaml }}
          version: ${{ env.ESPHOME_VERSION }}
      - uses: actions/upload-artifact@v7
        with:
          name: demo-${{ matrix.variant }}
          path: ${{ steps.esphome.outputs.name }}

  build-bar:
    # The bar build (firmware/pages/bar.yaml): real firmware that installs
    # from the beta channel on its own, for the free panels in bars. Every run
    # keeps it as a downloadable file (bar-<variant>, outside publish's
    # firmware-* pattern) for flashing a new bar panel by hand. On the beta
    # branch it is also the beta channel: its version gets "-beta.<run>" so
    # each one is newer than the last, and publish-beta puts it on the site.
    name: Build ${{ matrix.variant }} bar
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: branch-rules
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.beta.outputs.version }}
    strategy:
      matrix:
        include:
          - variant: moonhub75
            yaml: firmware/gameday-bar.yaml
          - variant: scoreboard75
            yaml: firmware/gameday-scoreboard75-bar.yaml
    steps:
      - uses: actions/checkout@v7
      - name: Beta version and summary
        id: beta
        env:
          NOW: ${{ inputs.install_now }}
        run: |
          set -euo pipefail
          v=$(sed -n 's/^  version: "\(.*\)"$/\1/p' firmware/gameday-common.yaml)
          summary="Development build"
          if [ "$GITHUB_REF" = refs/heads/beta ]; then
            v="$v-beta.$GITHUB_RUN_NUMBER"
            sed -i "s/^  version: \".*\"$/  version: \"$v\"/" firmware/gameday-common.yaml
            summary="Bar beta $v from ${GITHUB_SHA::7}."
            if [ -n "$NOW" ]; then
              # Panel names only; the firmware reads this list (auto_update.h).
              if ! [[ "$NOW" =~ ^[A-Za-z0-9_,\ -]+$ ]]; then
                echo "::error::install_now takes panel names like gameday-aba970, or all"
                exit 1
              fi
              summary="$summary Install now: $NOW"
            fi
          elif [ -n "$NOW" ]; then
            echo "::warning::install_now only does something on the beta branch"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "$v: $summary"
      - name: Build firmware
        id: esphome
        uses: esphome/build-action@v7
        with:
          yaml-file: ${{ matrix.yaml }}
          version: ${{ env.ESPHOME_VERSION }}
          complete-manifest: true
          release-summary: ${{ steps.beta.outputs.summary }}
          release-url: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
      - name: Stage output under a stable folder name
        run: |
          mkdir -p out
          cp -r "${{ steps.esphome.outputs.name }}" out/${{ matrix.variant }}
          ls -R out
      - name: Product name in the manifest
        run: ./scripts/set_manifest_name.sh out
      - uses: actions/upload-artifact@v7
        with:
          name: bar-${{ matrix.variant }}
          path: out

  publish-beta:
    # The beta channels, from one build of the beta branch:
    # - install.gameday-scoreboard.com/firmware/beta/<variant>/, the bar builds, read
    #   only by bar panels.
    # - install.gameday-scoreboard.com/firmware/<variant>-beta/, the release builds,
    #   read by panels with "Follow beta" on (the two-panel build follows
    #   moonhub75's, as it does for releases).
    # Runs when someone pushes (promotes) to beta, or runs Build on beta by
    # hand with install_now. Pages only deploys from main and release tags,
    # so the files go on the rolling beta-firmware prerelease and the Site
    # workflow on main republishes the site with them. The stable manifests
    # and the flasher are left as they are.
    name: Publish the beta channel
    needs: [build, build-bar, host-tests, web-tests]
    if: github.ref == 'refs/heads/beta' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bar-*
          path: stage/firmware/beta
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: firmware-moonhub75
          path: stage/release
      - uses: actions/download-artifact@v8
        with:
          name: firmware-scoreboard75
          path: stage/release
      - name: Check the files and store them on the beta-firmware prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BETA: ${{ needs.build-bar.outputs.version }}
        run: |
          set -euo pipefail
          for v in moonhub75 scoreboard75; do
            mv "stage/release/$v" "stage/firmware/$v-beta"
          done
          ls -R stage
          bash scripts/check_site_firmware.sh --beta stage
          bash scripts/check_site_firmware.sh --follow-beta stage "$BETA"
          mkdir -p release
          for v in moonhub75 scoreboard75; do
            (cd stage/firmware/beta && zip -r "../../../release/firmware-beta-$v.zip" "$v")
            (cd stage/firmware && zip -r "../../release/firmware-$v-beta.zip" "$v-beta")
          done
          notes="Beta firmware, not for customers. $BETA from $GITHUB_SHA. Bar panels read it from install.gameday-scoreboard.com/firmware/beta/, and panels with Follow beta on from install.gameday-scoreboard.com/firmware/<variant>-beta/; this prerelease only stores the files between site deploys."
          if gh release view beta-firmware >/dev/null 2>&1; then
            gh release upload beta-firmware release/*.zip --clobber
            gh release edit beta-firmware --prerelease --title "Beta $BETA" --notes "$notes"
          else
            gh release create beta-firmware release/*.zip --prerelease --target "$GITHUB_SHA" --title "Beta $BETA" --notes "$notes"
          fi
      - name: Republish the site from main with the new beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # site.yml won't deploy main while its version waits for a tag (see
          # its header); the beta then goes live with that release.
          git fetch -q --depth=1 origin main
          v=$(git show origin/main:firmware/gameday-common.yaml | sed -n 's/^  version: "\(.*\)"$/\1/p' | head -n1)
          tag=$(gh release view --json tagName --jq .tagName)
          if [ "v$v" != "$tag" ]; then
            echo "::warning::main is at v$v and the latest release is $tag, so this beta reaches the site with the v$v release, not now."
          fi
          # Until this change reaches main, main's site.yml has no from_beta
          # input and refuses the run. The files are stored either way, and
          # the next release's deploy publishes them.
          if ! gh workflow run site.yml --ref main -f from_beta=true; then
            echo "::warning::main's Site workflow doesn't take beta publishes yet, so this beta goes live with the next release."
          fi

  build-beta:
    # Early warning: the next ESPHome, allowed to fail. Nothing is published
    # from this job.
    name: Build ${{ matrix.variant }} (ESPHome beta)
    needs: notes
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: moonhub75
            yaml: firmware/gameday.yaml
          - variant: scoreboard75
            yaml: firmware/gameday-scoreboard75.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: esphome/build-action@v7
        with:
          yaml-file: ${{ matrix.yaml }}
          version: beta

  host-tests:
    name: Parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make -C tests
      - name: Replay tool builds
        run: make -C tests replay
      - name: Memory each ESPN read takes
        run: |
          make -C tests heap
          python3 scripts/size_budget.py host tests/build/heap.json sizes/host.json
      - uses: actions/upload-artifact@v7
        with:
          name: sizes-host
          path: sizes
      - name: Script selftests
        run: |
          python3 scripts/size_budget.py --selftest
          python3 scripts/factory_flash.py --selftest
          python3 scripts/burnin_monitor.py --selftest
          python3 scripts/improv_scan.py --selftest
          python3 scripts/crash_report.py --selftest
          python3 scripts/site_seo.py --selftest
      - name: Site pages have their search and sharing tags
        run: python3 scripts/site_seo.py check docs/site
      - name: Device page mock matches the firmware's set table
        run: python3 tests/web/mock_device.py --selftest
      - name: Fuzz the parsers (30 s a target)
        run: make -C tests fuzz
      - name: Keep the input a fuzz crash left
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: tests/build/crash-*
          if-no-files-found: ignore

  web-tests:
    # The device page (firmware/web/bundle.js) in Chromium against
    # tests/web/mock_device.py.
    name: Device page tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/web
    steps:
      - uses: actions/checkout@v7
      - name: bundle.js and bundle-demo.js are built from the current sources
        run: |
          python3 ../../scripts/build_web.py
          git diff --exit-code -- ../../firmware/web/bundle.js ../../firmware/web/bundle-demo.js || {
            echo "::error::firmware/web/bundle.js or bundle-demo.js is out of date. Run python scripts/build_web.py and commit both."
            exit 1
          }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  publish:
    name: Publish flasher and release
    needs: [build, host-tests, web-tests, notes]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/firmware
          # docs/site/. (not docs/site/*) so .well-known/ is copied too.
          cp -r docs/site/. site/
          # This tag's release is created after the deploy, so its date comes from --date.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --exclude-pre-releases --json tagName,publishedAt > /tmp/releases.json
          python3 scripts/release_notes.py --page site/changelog/index.html --dates /tmp/releases.json --date "$GITHUB_REF_NAME=$(TZ=America/Chicago date +%F)"
          cp -r artifacts/* site/firmware/
          sed -i "s/__VERSION__/${GITHUB_REF_NAME}/g" site/index.html
          # Support's FAQPage JSON-LD, sitemap.xml and robots.txt.
          python3 scripts/site_seo.py build site
          ls -R site
          bash scripts/check_site_firmware.sh site "$GITHUB_REF_NAME"
      # Keep the bar panels' beta channel on the site through a release.
      - name: Add the beta channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/add_beta_channel.sh site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # docs/site/.well-known has to reach the site; v4 and later drop
          # dotfiles unless asked.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Create the release with notes and binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          # MoonHub75 keeps the unsuffixed factory bin name it has always had.
          f=$(ls artifacts/moonhub75/*.factory.bin | head -1)
          cp "$f" "release/gameday-scoreboard-${GITHUB_REF_NAME}.factory.bin"
          f=$(ls artifacts/scoreboard75/*.factory.bin | head -1)
          cp "$f" "release/gameday-scoreboard-${GITHUB_REF_NAME}-scoreboard75.factory.bin"
          ASSETS="release/gameday-scoreboard-${GITHUB_REF_NAME}.factory.bin release/gameday-scoreboard-${GITHUB_REF_NAME}-scoreboard75.factory.bin"
          # Also zip each variant's manifest folder (manifest.json plus the
          # OTA and factory bins it references, with relative paths that
          # resolve the same wherever the folder lands) so site.yml can
          # rebuild site/firmware/<variant>/ from a release asset instead of
          # a Build artifact, which expires after 90 days.
          for v in moonhub75 moonhub75-2panel scoreboard75; do
            (cd artifacts && zip -r "../release/firmware-$v.zip" "$v")
            ASSETS="$ASSETS release/firmware-$v.zip"
          done
          PREV=$(gh release list --exclude-drafts --exclude-pre-releases --limit 20 --json tagName --jq "[.[].tagName | select(. != \"${GITHUB_REF_NAME}\")][0]")
          {
            cat notes/notes.md
            echo
            echo "Install or update from the [flasher page](https://install.gameday-scoreboard.com/), or let a panel already running v0.2.2 or later update itself from its device page."
            if [ -n "$PREV" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            fi
          } > release/body.md
          gh release create "$GITHUB_REF_NAME" $ASSETS --title "$GITHUB_REF_NAME" --notes-file release/body.md || \
          { gh release upload "$GITHUB_REF_NAME" $ASSETS --clobber; gh release edit "$GITHUB_REF_NAME" --notes-file release/body.md; }
      # The same update feed on updates.gameday-scoreboard.com, which panels
      # read when install.gameday-scoreboard.com fails. Last, so a mirror problem never
      # holds up the release.
      - name: Publish the update mirror
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIRROR_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/publish_mirror.sh site
