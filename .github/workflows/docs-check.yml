name: Docs updated

# A change to the firmware or the components has to come with a docs change,
# so the guides don't drift from what the panel does. Applies to PRs into dev
# only; the promotion PRs into beta and main carry changes that already
# passed here. The generated web bundles don't count as a firmware change.
#
# A PR that changes nothing an owner or a DIY builder can see (a refactor, a
# test, a build fix) says so on its own line in the PR description:
#
#   No owner-visible change, no docs: <why, in a few words>
#
# The reviewer checks that claim like any other part of the PR. The check
# fails only when a PR has neither a docs change nor that line, which the
# author can fix. The label "docs: not needed" still passes too.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches: [dev]

permissions:
  contents: read

jobs:
  docs:
    name: Docs updated with the firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for a docs change
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, '|') }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          firmware=$(grep -E '^(firmware|components)/' <<<"$changed" \
            | grep -vE '^firmware/web/(bundle|bundle-demo)\.js$' || true)
          if [ -z "$firmware" ]; then
            echo "No firmware or component change, so no docs change is needed."
            exit 0
          fi
          echo "Firmware changes:"
          echo "$firmware"
          if grep -q '^docs/wiki/src/content/docs/' <<<"$changed"; then
            echo "This PR also changes the docs."
            exit 0
          fi
          # The line needs a reason after the colon (four characters or more).
          if tr -d '\r' <<<"$BODY" | grep -qiE '^[[:space:]]*no owner-visible change, no docs:[[:space:]]*[^[:space:]].{3,}'; then
            echo "The description says no owner-visible change:"
            tr -d '\r' <<<"$BODY" | grep -iE '^[[:space:]]*no owner-visible change, no docs:'
            exit 0
          fi
          if tr '|' '\n' <<<"$LABELS" | grep -qxF 'docs: not needed'; then
            echo "Labeled 'docs: not needed', so the docs check is skipped."
            exit 0
          fi
          echo "::error::This PR changes the firmware but not the docs. Add or update a page under docs/wiki/src/content/docs/, or, if nothing an owner or DIY builder can see changed, add a line to the PR description: 'No owner-visible change, no docs: <why>'."
          exit 1
