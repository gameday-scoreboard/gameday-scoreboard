name: Feature request
description: Something the scoreboard doesn't do yet.
labels: [enhancement, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like it to do
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you'd use it for, or what bugs you today. This helps more than a proposed fix.
    validations:
      required: true
  - type: input
    id: sport
    attributes:
      label: Sport or league
      description: If it's about a particular one.
      placeholder: "College basketball"
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Sketches, photos or links to something similar.
