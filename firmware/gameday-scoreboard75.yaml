# Game Day Scoreboard for a HUB75 matrix on the early scoreboard75 test
# controller boards (not a product). Same firmware as gameday.yaml, which
# targets the MoonHub75 pinout; only the controller package differs.
substitutions:
  variant: "scoreboard75"
  # Ships with a single 128x64 panel, so boot (and Factory Reset) as 128 wide.
  default_panel_cols: "2"

packages:
  controller: !include controllers/scoreboard75.yaml
  common: !include gameday-common.yaml
