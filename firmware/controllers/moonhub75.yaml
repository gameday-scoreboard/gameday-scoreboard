# ESP32-S3 HUB75 controller on the MoonHub75 pinout, 16MB flash, octal PSRAM,
# I2S microphone on IO10/11/12 and a button on GPIO0. Pin map (ESPHome names;
# the MoonHub75 README calls the upper half R0/G0/B0):
#   R1 1, G1 5, B1 6, R2 7, G2 13, B2 9, A 16, B 48, C 47, D 21, E 38,
#   LAT 8, OE 4, CLK 18
# Derived from hub75-studio's controller packages (MIT, Stuart Parmenter).

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: PERF
      execute_from_psram: true
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y

psram:
  mode: octal
  speed: 80MHz

i2s_audio:
  id: i2s_mic_bus
  i2s_lrclk_pin: GPIO12
  i2s_bclk_pin: GPIO11

# 24-bit samples left-justified in 32-bit words; low 8 bits are padding.
microphone:
  - platform: i2s_audio
    id: mic
    adc_type: external
    i2s_din_pin: GPIO10
    sample_rate: 16000
    bits_per_sample: 32bit
    use_apll: true
    pdm: false
    channel: left
    i2s_mode: primary
    i2s_audio_id: i2s_mic_bus

display:
  - platform: hub75
    id: matrix
    r1_pin: 1
    g1_pin: 5
    b1_pin: 6
    r2_pin: 7
    g2_pin: 13
    b2_pin: 9
    a_pin: 16
    b_pin: 48
    c_pin: 47
    d_pin: 21
    e_pin: 38
    lat_pin: 8
    oe_pin: 4
    clk_pin: 18

    panel_width: ${display_panel_width}
    panel_height: ${display_panel_height}
    layout: ${display_layout}
    layout_rows: ${display_layout_rows}
    layout_cols: ${display_layout_cols}
    scan_wiring: ${display_scan_wiring}

    clock_phase: false
    latch_blanking: 1
    clock_speed: 20MHz

    bit_depth: 8

    # for LVGL
    double_buffer: false
    auto_clear_enabled: false
    update_interval: never

switch:
  - platform: template
    id: mic_mute_sw
    name: "Microphone Enabled"
    icon: "mdi:microphone"
    restore_mode: ALWAYS_ON
    lambda: |-
      return !id(mic).get_mute_state();
    turn_on_action:
      - microphone.unmute: mic
    turn_off_action:
      - microphone.mute: mic

# Boot button (GPIO0) as power toggle. GPIO0 is a strapping pin; it is safe
# as an input after boot, so the build-time warning is suppressed on purpose.
binary_sensor:
  - platform: gpio
    id: power_button
    internal: true
    pin:
      number: GPIO0
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_click:
      then:
        # QC mode (pages/qc.yaml) has the button while it runs.
        - if:
            condition:
              lambda: 'return !id(qc_active);'
            then:
              - switch.toggle: power

lvgl:
  byte_order: little_endian
  buffer_size: 100%
  displays:
    - matrix
