# Game Day Scoreboard for a HUB75 matrix on the Waveshare ESP32-S3-RGB-Matrix
# (waveshare pinout), the board ready-made scoreboards ship on. Same firmware
# as gameday.yaml, which targets the MoonHub75 pinout; only the controller
# package differs. The installer offers it; it hasn't run on hardware yet.
substitutions:
  variant: "waveshare"
  # Bench target is one 128x64 panel, so boot (and Factory Reset) as 128 wide.
  default_panel_cols: "2"

packages:
  controller: !include controllers/waveshare.yaml
  common: !include gameday-common.yaml
