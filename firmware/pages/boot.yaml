# Boot and setup screen. Shown over everything until the panel is on WiFi
# and has shown its connect hint for a while; the boot button brings the
# full address back.
#
# Five states, driven by the real WiFi state every half second. Each is a
# title plus up to four lines: small, big, small, small. boot_refresh tests
# them in this order: connected, waiting, wifi lost, setup, connecting.
#
# Three of them carry a QR code for https://app.gameday-scoreboard.com/setup,
# an app link: the phone opens the Game Day app when it is installed and
# the setup web page when it is not. Keep it at 42 bytes or less (it is
# 40): LVGL encodes at error correction M, so 42 bytes is the most that
# fits QR version 3, the largest that draws 2 px a module in 64 px. On a
# 128 px chain the code sits on the left half and the lines move to the right half, so
# nothing has to take turns with it. On a single 64 px panel there is no
# room for both, so the code takes turns with the lines. See boot_qr_box
# below for the sizing and boot_qr_cycle for the timing.
#
#   connected   64:  QR (13 s), then Open / gameday- / 2f6a70.local (5 s)
#               128: QR + Scan for / Game Day / app, the address taking the
#                    same 5 s turn on the right
#   wifi lost   64:  Wi-Fi / lost / open app (5 s), QR (8 s)
#               128: QR + Wi-Fi / lost / open app
#   setup       64:  SETUP / Game Day / app (5 s), QR (8 s), then once the
#                    hotspot is actually up Join WiFi / Game Day /
#                    2f6a70 (5 s), the hotspot's own name
#               128: QR + SETUP / Game Day / app (13 s), then the hotspot
#                    lines (5 s) once it is up
#   connecting  Connecting to / <network name>, full width, no QR
#   waiting     64:  Waiting for / <network name> (5 s), Just had a /
#                    power cut? / Routers take / a few min (5 s)
#               128: Waiting for / <network name> / Just had a power cut? /
#                    Routers take a few min, full width, no QR
#   sign-in     64:  Wi-Fi needs / sign-in / use home or / a hotspot (5 s),
#                    QR (8 s)
#               128: QR + the same lines
#
# "sign-in" is a connected panel on a Wi-Fi that holds everything behind a
# sign-in page (a bar, hotel or dorm; components/gameday/captive.h). It comes
# up over the board when the gameday component sends "captive" and goes on
# "captive_clear", once ESPN answers (gameday-common.yaml). The boot button's
# address still takes over while it is held.
#
# "waiting" is a boot that has not reached its saved network 30 s in and may
# be back from a power cut, when the router takes minutes to start. It holds
# until 3 minutes in, then gives way to "wifi lost".
#
# "wifi lost" means the panel has a saved network and is not on it, either
# because it dropped or because it never came up this boot. It sits above the
# setup state on purpose, and never shows the hotspot text: an owner whose
# settings are fine should never be told to re-provision the panel. The app
# leads in setup; the hotspot keeps a turn because it is the only way in
# without an iPhone.
#
# Connected: every panel shows the QR for the app once it joins Wi-Fi,
# with or without a team. A fresh panel keeps it up for 45 seconds, or
# until a team is picked. A panel that already has a team gets one run of
# turns, 18 seconds, and then its board. The address turn is what "Show
# address at boot" on the device page controls, since it is how someone who
# set the panel up through the hotspot finds it again; with the setting off
# a fresh panel shows only the QR, and a panel with a team skips the screen
# and goes straight to its board. Coming back to the same network after a
# drop is not a new join and shows nothing: the Wi-Fi lost screen already
# carried the QR. A boot button hold always shows the full address and IP, full
# width, with no QR, for 20 seconds. Off Wi-Fi the overlay never hides, so
# the button cannot blank a panel that is in setup or has lost its network.
# A panel with no team picked brings the QR back over the board for 13 s
# every 3 minutes (boot_app_qr_turn) until one is.
#
# Nothing here should scroll. Lines are kept to 12 characters (60 px of
# Spleen 5x8) on a 64 px column, the hostname is split at its dash to fit,
# and anything still too long (an SSID, a long IP) scrolls at 12 px/s
# instead of LVGL's default 40, which crosses a 64 px panel in a second and
# a half.
#
# Hiding waits for the first real scoreboard. Whatever asks for the hide
# (the timers above, a team pick, the boot button's 20 s running out), the
# overlay stays up on Wi-Fi with "Looking up scores" and the bar moving until
# the gameday component says the board is ready, and never more than 10 s
# (BOOT_HOLD_CAP_MS in components/gameday/startup.h) after that ask. A team
# change asks again (board_pending in gameday-common.yaml), so the new team's
# scores load behind this screen instead of on a half-empty board.
#
# improv_ble (Bluetooth setup, how the Game Day app provisions a panel)
# also draws the setup or lost lines when it starts advertising, so they are
# up before the next poll, and JOINING / <network> once the app hands over
# credentials, which both off-Wi-Fi states keep up until the panel connects.
# See the improv_ble block below.

globals:
  - id: boot_ip_shown_ms
    type: uint32_t
    initial_value: '0'
  - id: boot_bar_value
    type: int
    initial_value: '0'
  - id: boot_button_press_ms
    type: uint32_t
    initial_value: '0'
  - id: boot_hold_stage
    type: int
    initial_value: '0'
  # millis() at the last moment the panel was seen on its saved network this
  # boot, 0 if it has never been on it. Read by boot_refresh and boot_hide to
  # work out whether Wi-Fi is lost; nothing latches that as a flag, because a
  # flag does not survive the offline restart in gameday-common.yaml
  # and never gets set at all on a boot that never connects.
  - id: boot_last_connected_ms
    type: uint32_t
    initial_value: '0'
  # millis() when the current run of text/QR turns started, 0 while the QR
  # is not wanted. Restarting from 0 means every run opens on the text.
  - id: boot_qr_since_ms
    type: uint32_t
    initial_value: '0'
  # Who owns the current run of turns (see boot_qr_cycle), so a change of
  # state or of its extra turn starts the run again from the first frame.
  - id: boot_qr_key
    type: int
    initial_value: '0'
  # True once the panel has had a real saved network this boot. A failed
  # handover from the app calls clear_sta(), which makes has_sta() false
  # while the panel is still in an outage; this keeps it in the Wi-Fi lost
  # state instead of dropping to the setup lines. "Reset Wi-Fi" is the only
  # deliberate way to lose the network and it restarts the panel, which
  # clears this.
  - id: boot_had_creds
    type: bool
    initial_value: 'false'
  # True when this boot could be the panel coming back from a power cut, so
  # the router may still be starting (see the waiting state in boot_refresh).
  # A software restart is not one: the offline restart in gameday-common.yaml,
  # an update, the Reboot button. Those panels go to Wi-Fi lost at the usual
  # 30 s, since the owner may already have seen it before the restart. A
  # crash or watchdog restart keeps the grace: it can't tell a router outage
  # from a healthy one, and the wait costs nothing.
  - id: boot_power_cut_grace
    type: bool
    initial_value: 'esp_reset_reason() != ESP_RST_SW'
  # The turn boot_qr_cycle picked: 0 the state's own text, 1 the QR code,
  # 2 the hotspot text. boot_refresh reads it to choose the lines.
  - id: boot_qr_frame
    type: int
    initial_value: '0'
  # Which layout boot_layout last applied: 1 for the QR-left, lines-right
  # split of a 128 px chain, 0 for full width.
  - id: boot_layout_side
    type: int
    initial_value: '0'
  # millis() when the overlay started holding for the first scoreboard (see
  # boot_hide), 0 while it is not holding.
  - id: boot_hold_since_ms
    type: uint32_t
    initial_value: '0'
  # True while boot_app_qr_turn has the overlay up.
  - id: boot_app_qr_on
    type: bool
    initial_value: 'false'
  # The network the panel last joined this boot, empty before the first
  # join. Coming back to the same one after a drop is not a new join.
  - id: boot_joined_ssid
    type: std::string
    initial_value: ''
  # Whether this join shows the app's QR code (see boot_refresh). Decided
  # once per join, when boot_ip_shown_ms is still 0.
  - id: boot_join_qr
    type: bool
    initial_value: 'false'

script:
  # Positions and fonts. side true puts the lines in the right half of a
  # 128 px chain, beside the QR, with the single panel fonts; false uses the
  # whole width. side is ignored on a 64 px panel.
  - id: boot_layout
    parameters:
      side: bool
    then:
      - lambda: |-
          const int W = lv_disp_get_hor_res(lv_disp_get_default());
          const bool col = side && W >= 128;
          const bool wide = W >= 128 && !col;
          const int x0 = col ? 64 : 0;
          const int cw = col ? 64 : W;
          lv_obj_t *lines[4] = {id(boot_la), id(boot_lb), id(boot_lc), id(boot_ld)};
          for (auto *l : lines) {
            lv_obj_set_width(l, cw - 4);
            lv_obj_set_x(l, x0 + 2);
          }
          lv_obj_set_width(id(boot_title), cw);
          lv_obj_set_width(id(boot_rule), cw - 8);
          lv_obj_set_width(id(boot_bar), cw - 16);
          lv_obj_set_pos(id(boot_bar), x0 + 8, wide ? 61 : 59);
          if (wide) {
            lv_obj_set_style_text_font(id(boot_title), id(spleen_16), 0);
            lv_obj_set_pos(id(boot_title), x0, 2);
            lv_obj_set_pos(id(boot_rule), x0 + 4, 19);
            lv_obj_set_style_text_font(id(boot_lb), id(spleen_12), 0);
            lv_obj_set_y(id(boot_la), 22);
            lv_obj_set_y(id(boot_lb), 31);
            lv_obj_set_y(id(boot_lc), 44);
            lv_obj_set_y(id(boot_ld), 53);
          } else {
            lv_obj_set_style_text_font(id(boot_title), id(spleen_12), 0);
            lv_obj_set_pos(id(boot_title), x0, 1);
            lv_obj_set_pos(id(boot_rule), x0 + 4, 14);
            lv_obj_set_style_text_font(id(boot_lb), id(spleen_8), 0);
            lv_obj_set_y(id(boot_la), 16);
            lv_obj_set_y(id(boot_lb), 26);
            lv_obj_set_y(id(boot_lc), 36);
            lv_obj_set_y(id(boot_ld), 46);
          }

  # Pick the layout (see boot_layout) and show or hide the QR. The layout is
  # only reapplied when it changes, since boot_refresh calls this twice a
  # second.
  - id: boot_view
    parameters:
      side: bool
      qr: bool
    then:
      - lambda: |-
          if (id(boot_layout_side) != (int) side) {
            id(boot_layout_side) = side;
            id(boot_layout).execute(side);
          }
          if (qr) lv_obj_clear_flag(id(boot_qr_box), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(boot_qr_box), LV_OBJ_FLAG_HIDDEN);

  # Write the four lines. A line wider than its column scrolls at 12 px/s,
  # about two and a half characters a second, not LVGL's 40 px/s default.
  # The duration is worked out per line from its width, because LVGL's own
  # speed setting rounds to 10 px/s and caps a pass at 10 s, which speeds
  # long lines up. One pass is the text plus the three space gap LVGL puts
  # before it comes round again.
  - id: boot_set_lines
    parameters:
      la: string
      lb: string
      lc: string
      ld: string
      busy: bool
    then:
      - lambda: |-
          auto put = [](lv_obj_t *l, const std::string &text) {
            // A network name can hold characters the fonts lack (backlog #144).
            const std::string t = gameday::panel_text(text);
            const lv_font_t *font = lv_obj_get_style_text_font(l, LV_PART_MAIN);
            lv_point_t sz;
            lv_text_get_size(&sz, t.c_str(), font, 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
            const int32_t px = sz.x + 3 * lv_font_get_glyph_width(font, ' ', ' ');
            const uint32_t ms = px > 0 ? (uint32_t) px * 1000 / 12 : 1000;
            // Only when it changes: setting a style restarts the scroll.
            if (lv_obj_get_style_anim_duration(l, LV_PART_MAIN) != ms)
              lv_obj_set_style_anim_duration(l, ms, 0);
            const char *cur = lv_label_get_text(l);
            if (cur == nullptr || t != cur)
              lv_label_set_text(l, t.c_str());
          };
          put(id(boot_la), la);
          put(id(boot_lb), lb);
          put(id(boot_lc), lc);
          put(id(boot_ld), ld);
          if (busy) lv_obj_clear_flag(id(boot_bar), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(boot_bar), LV_OBJ_FLAG_HIDDEN);

  # The timing for states that take turns. Sets boot_qr_frame: 0 for the
  # first 5 s, 1 for the next 8 s, then 2 for 5 s when extra is true, and for
  # owner 4 a last 5 s as 3, round and round. boot_refresh decides what each
  # frame shows. owner says whose run it is (1 connected, 2 wifi lost, 3
  # setup, 4 setup after "Reset Wi-Fi", 5 sign-in, 0 none): a new owner, or
  # the same one gaining or losing its extra turn, starts again at frame 0,
  # so a run never opens partway through. 0 stops the turns.
  - id: boot_qr_cycle
    parameters:
      owner: int
      extra: bool
    then:
      - lambda: |-
          static const uint32_t TEXT_MS = 5000, QR_MS = 8000, EXTRA_MS = 5000, UNPLUG_MS = 5000;
          int frame = 0;
          const int key = owner == 0 ? 0 : owner * 2 + (extra ? 1 : 0);
          if (key == 0) {
            id(boot_qr_since_ms) = 0;
          } else {
            if (key != id(boot_qr_key) || id(boot_qr_since_ms) == 0)
              id(boot_qr_since_ms) = millis() == 0 ? 1 : millis();
            const uint32_t extra_ms = extra ? EXTRA_MS : 0;
            const uint32_t period = TEXT_MS + QR_MS + extra_ms + (owner == 4 ? UNPLUG_MS : 0);
            const uint32_t t = (millis() - id(boot_qr_since_ms)) % period;
            frame = t < TEXT_MS ? 0 : t < TEXT_MS + QR_MS ? 1 : t < TEXT_MS + QR_MS + extra_ms ? 2 : 3;
          }
          id(boot_qr_key) = key;
          id(boot_qr_frame) = frame;

  - id: boot_refresh
    parameters:
      via_button: bool
    then:
      - lambda: |-
          auto *w = wifi::global_wifi_component;
          if (w == nullptr) return;
          // The boot button's countdown has the screen (boot_hold_tick).
          if (id(boot_hold_stage) >= 2) return;
          // The app is mid-handover: no QR and no turns, just JOINING.
          const bool provisioning =
              improv_ble::global_improv_component != nullptr &&
              improv_ble::global_improv_component->get_improv_state() ==
                  improv::STATE_PROVISIONING;
          // Lost means: there is a real saved network and the panel is not on
          // it. Derived from the live Wi-Fi state every time rather than
          // latched, so it is still right after the offline restart
          // and on a cold boot with the router already down.
          //
          // Two cases, deliberately different. Connected at some point this
          // boot and not now is a drop: say so immediately, the owner is
          // watching a board that just stopped updating. Never connected this
          // boot could just be a panel still coming up, so wait out a grace
          // period first. Association normally takes a few seconds, and 30
          // leaves room for a scan and a retry without ever flashing the alarm
          // on a healthy boot.
          //
          // After a power cut the panel is up in seconds and the router takes
          // minutes, so a boot that may be one (boot_power_cut_grace) says it
          // is waiting for the network until 3 minutes in, and only then that
          // Wi-Fi is lost. Bluetooth and the hotspot still start on time.
          //
          // The blank-SSID half of have_creds is what keeps a panel out of
          // here after "Reset Wi-Fi": that panel boots with an empty network in
          // memory, which still counts as has_sta(), and is in setup, not in
          // trouble. boot_had_creds carries a real network through a failed
          // handover from the app, which clears the one in memory.
          const bool have_creds = w->has_sta() && !w->get_sta().get_ssid().empty();
          if (have_creds) id(boot_had_creds) = true;
          static const uint32_t GRACE_MS = 30000, ROUTER_MS = 3 * 60 * 1000;
          const bool never = id(boot_last_connected_ms) == 0;
          const bool waiting = id(boot_had_creds) && never && id(boot_power_cut_grace) &&
                               millis() > GRACE_MS && millis() <= ROUTER_MS;
          const bool lost = id(boot_had_creds) && !waiting && (!never || millis() > GRACE_MS);
          const bool wide = lv_disp_get_hor_res(lv_disp_get_default()) >= 128;
          // The network it is trying to join. wifi_ssid_to() stays blank until
          // the panel is on one, so name the saved network that worked last,
          // which is the one it tries first.
          auto network = [w]() -> std::string {
            char buf[wifi::SSID_BUFFER_SIZE];
            std::string name = w->wifi_ssid_to(buf);
            if (name.empty()) {
              const auto nets = id(gd_networks).list();
              name = nets.empty() ? w->get_sta().get_ssid().str() : nets.front().ssid;
            }
            return name;
          };
          // The address as up to two lines of 12 characters, split after the
          // dash in gameday-2f6a70.local. A name that will not split that way
          // stays on one line and scrolls, slowly.
          const std::string host = id(gameday_ctl).hostname() + ".local";
          std::string h1 = host, h2;
          if (host.size() > 12) {
            const size_t dash = host.rfind('-');
            if (dash != std::string::npos && dash + 1 <= 12 && host.size() - dash - 1 <= 12) {
              h1 = host.substr(0, dash + 1);
              h2 = host.substr(dash + 1);
            }
          }
          if (w->is_connected()) {
            if (id(boot_ip_shown_ms) == 0) {
              // A new join: every boot, and any network the panel was not on
              // before this boot (the app handing over a new router's
              // network mid-outage). Coming back to the same network after a
              // drop is not one; the Wi-Fi lost screen already showed the QR.
              char buf[wifi::SSID_BUFFER_SIZE];
              const std::string ssid = w->wifi_ssid_to(buf);
              const bool same = !id(boot_joined_ssid).empty() && ssid == id(boot_joined_ssid);
              id(boot_joined_ssid) = ssid;
              id(boot_join_qr) = !id(gameday_ctl).setup_done() || (!same && id(gameday_ctl).show_boot_address());
              ESP_LOGI("boot", "On Wi-Fi (%s): %s", same ? "same network" : "new join",
                       id(boot_join_qr) ? "showing the app's QR code" : "straight to the board");
            }
            id(boot_last_connected_ms) = millis() == 0 ? 1 : millis();
            // boot_show_address keeps the button's address up for 20 s, and
            // boot_check's twice a second polls must not swap it back.
            if (via_button || id(boot_show_address).is_running()) {
              // Boot button hold: always the full address and IP, never the
              // QR, full width.
              std::string ip;
              for (auto &a : w->wifi_sta_ip_addresses()) {
                if (a.is_set() && a.is_ip4()) {
                  char buf[48];
                  a.str_to(buf);
                  ip = buf;
                  break;
                }
              }
              id(boot_qr_cycle).execute(0, false);
              id(boot_view).execute(false, false);
              if (wide)
                id(boot_set_lines).execute("On your phone, open", host, "or " + ip, "then pick your team", false);
              else if (h2.empty())
                id(boot_set_lines).execute("Open", h1, ip, "pick a team", false);
              else
                id(boot_set_lines).execute(h1, h2, ip, "pick a team", false);
            } else if (id(gameday_ctl).captive()) {
              // On Wi-Fi, but it holds everything behind a sign-in page
              // (components/gameday/captive.h). The panel can't sign in, so
              // send the owner to another network: the QR opens the app,
              // which hands the panel a home network or a phone hotspot.
              id(boot_qr_cycle).execute(5, false);
              id(boot_view).execute(wide, wide || id(boot_qr_frame) == 1);
              id(boot_set_lines).execute("Wi-Fi needs", "sign-in", "use home or", "a hotspot", false);
            } else if (id(boot_hold_since_ms) != 0) {
              id(boot_hold_view).execute();
            } else {
              // Normal connect: the QR for the app, with the address taking a
              // turn when "Show address at boot" is on. Every panel, with or
              // without a team: whoever just put it on Wi-Fi is the person
              // who needs the app next. A panel with a team and the setting
              // off, or back on its network after a drop, hides straight
              // away (see the hide timers below) and only flashes the hold
              // view here. boot_app_qr_turn borrows the same view.
              if (id(boot_join_qr) || id(boot_app_qr_on)) {
                id(boot_qr_cycle).execute(1, id(gameday_ctl).show_boot_address());
                const bool addr = id(boot_qr_frame) == 2;
                id(boot_view).execute(wide, wide || !addr);
                if (addr)
                  id(boot_set_lines).execute("Open", h1, h2, "", false);
                else if (wide)
                  id(boot_set_lines).execute("Scan for", "Game Day", "app", "", false);
                else
                  id(boot_set_lines).execute("", "", "", "", false);
              } else {
                id(boot_hold_view).execute();
              }
            }
            if (id(boot_ip_shown_ms) == 0) {
              id(boot_ip_shown_ms) = millis() == 0 ? 1 : millis();
              // A panel with a team gets one run of boot_qr_cycle's turns:
              // 13 s of QR, then the address's 5 s.
              if (!id(gameday_ctl).setup_done())
                id(boot_hide_later).execute(45000);
              else if (id(boot_join_qr))
                id(boot_hide_later).execute(18000);
              else
                id(boot_hide).execute();
            }
            // Holding for the first scoreboard: boot_hide ends the hold once
            // the board is ready or the cap has run out.
            if (id(boot_hold_since_ms) != 0 && !via_button && !id(boot_show_address).is_running() &&
                !id(gameday_ctl).boot_hold(id(boot_hold_since_ms)))
              id(boot_hide).execute();
          } else if (waiting) {
            // Maybe a power cut, router still starting. Ahead of the setup
            // branch for the same reason as lost below: the hotspot comes up
            // inside these 3 minutes. No QR: nothing needs the app yet. On a
            // 64 px panel the network name and the power cut take turns.
            id(boot_qr_cycle).execute(0, false);
            id(boot_view).execute(false, false);
            if (provisioning) {
              const std::string joining = w->get_sta().get_ssid().str();
              id(boot_set_lines).execute("JOINING", joining.empty() ? std::string("Wi-Fi") : joining, "", "", true);
            } else if (wide)
              id(boot_set_lines).execute("Waiting for", network(), "Just had a power cut?",
                                         "Routers take a few min", true);
            else if ((millis() - GRACE_MS) % 10000 < 5000)
              id(boot_set_lines).execute("Waiting for", network(), "", "", true);
            else
              id(boot_set_lines).execute("Just had a", "power cut?", "Routers take", "a few min", true);
          } else if (lost) {
            // Tested before the setup branch below on purpose. The fallback AP
            // starts 90 seconds into any outage, so that branch would otherwise
            // take over for the rest of the outage and tell an owner whose
            // settings are perfectly fine to go re-provision the panel.
            //
            // Wi-Fi we already had went away. Keep saying so rather than
            // "Connecting to <network>", which reads like a first boot and
            // does not tell the customer what to do about it. No hotspot turn
            // here, even once the fallback AP is up, for the same reason.
            id(boot_qr_cycle).execute(provisioning ? 0 : 2, false);
            id(boot_view).execute(wide && !provisioning,
                                  !provisioning && (wide || id(boot_qr_frame) == 1));
            if (provisioning) {
              const std::string joining = w->get_sta().get_ssid().str();
              id(boot_set_lines).execute("JOINING", joining.empty() ? std::string("Wi-Fi") : joining, "", "", true);
            } else
              id(boot_set_lines).execute("Wi-Fi", "lost", "open app", "", true);
          } else if (!w->has_sta() || w->is_ap_active()) {
            // Setup: no saved network, or a blank one after "Reset Wi-Fi".
            // Lead with the app, then the hotspot for anyone without an
            // iPhone. The hotspot turn waits until the AP is really up, so it
            // never points at a network that is not there yet. On a 128 px
            // chain the QR stays up throughout; on 64 it is frame 1. After
            // "Reset Wi-Fi" (owner 4) a last turn says that unplugging the
            // panel takes it back to the networks it already knows.
            id(boot_qr_cycle).execute(provisioning ? 0 : id(gd_networks).in_setup() ? 4 : 3, w->is_ap_active());
            const int frame = id(boot_qr_frame);
            id(boot_view).execute(wide && !provisioning,
                                  !provisioning && (wide || frame == 1));
            if (provisioning) {
              const std::string joining = w->get_sta().get_ssid().str();
              id(boot_set_lines).execute("JOINING", joining.empty() ? std::string("Wi-Fi") : joining, "", "", true);
            } else if (frame == 3) {
              id(boot_set_lines).execute("Unplug it to", "rejoin", "saved Wi-Fi", "", true);
            } else if (frame == 2) {
              // The hotspot is "Game Day <suffix>", named in on_boot.
              const std::string &name = App.get_name();
              id(boot_set_lines).execute("Join WiFi", "Game Day", name.substr(name.rfind('-') + 1), "", true);
            } else
              id(boot_set_lines).execute("SETUP", "Game Day", "app", "", true);
          } else {
            id(boot_qr_cycle).execute(0, false);
            id(boot_view).execute(false, false);
            id(boot_set_lines).execute(wide ? "Connecting to" : "Connecting", network(), "", "", true);
          }

  # Keep the address up for a while after connecting, then clear the overlay
  - id: boot_hide_later
    mode: restart
    parameters:
      ms: int
    then:
      - delay: !lambda 'return ms;'
      - script.execute: boot_hide

  # Waiting for the first scoreboard, at boot or after a team change: full
  # width, no QR, the bar moving.
  - id: boot_hold_view
    then:
      - lambda: |-
          const bool wide = lv_disp_get_hor_res(lv_disp_get_default()) >= 128;
          id(boot_qr_cycle).execute(0, false);
          id(boot_view).execute(false, false);
          if (wide)
            id(boot_set_lines).execute("", "Looking up scores", "", "", true);
          else
            id(boot_set_lines).execute("", "Looking up", "scores", "", true);

  - id: boot_hide
    then:
      # The boot button's countdown owns the overlay (boot_hold_tick):
      # nothing hides it or paints over it until the button is let go, and
      # the release ends in boot_show_address, which asks for this again.
      - if:
          condition:
            lambda: 'return id(boot_hold_stage) < 2;'
          then:
            - if:
                condition:
                  lambda: |-
                    // Not on Wi-Fi: the overlay is the only thing telling the owner
                    // what to do, whether the panel lost its network or was never
                    // set up. Never hide it out from under them, whatever asked
                    // for the hide (the boot button's 20 s timer, for one, which
                    // used to blank a panel in setup until a restart).
                    auto *w = wifi::global_wifi_component;
                    return w != nullptr && !w->is_connected();
                then:
                  # Re-arm the hide for when Wi-Fi comes back. A drop shorter than
                  # boot_wifi_lost_later's wait never resets this, so the overlay
                  # would otherwise stay over the scoreboard.
                  - lambda: 'id(boot_ip_shown_ms) = 0;'
                  - component.resume: boot_check
                  - component.resume: boot_anim
                  - script.execute:
                      id: boot_refresh
                      via_button: false
                else:
                  - if:
                      condition:
                        lambda: |-
                          // On Wi-Fi that wants a sign-in, the overlay is what says
                          // so (boot_refresh). It goes when that clears: the
                          // captive_clear action in gameday-common.yaml asks again.
                          return id(gameday_ctl).captive() && !id(qc_active);
                      then:
                        # A hold for the first scoreboard that started before the
                        # sign-in state ends here: boot_refresh would otherwise ask
                        # for this hide again every tick once the hold ran out, and
                        # captive_clear starts a fresh one.
                        - lambda: 'id(boot_hold_since_ms) = 0;'
                        - component.resume: boot_check
                        - component.resume: boot_anim
                        # Paint now when the overlay was hidden, but not from inside
                        # boot_refresh, which can be what called this.
                        - if:
                            condition:
                              not:
                                script.is_running: boot_refresh
                            then:
                              - script.execute:
                                  id: boot_refresh
                                  via_button: false
                        - lvgl.obj.update:
                            id: boot_overlay
                            hidden: false
                      else:
                        - if:
                            condition:
                              lambda: |-
                                // On Wi-Fi, but the first scoreboard is not ready: hold
                                // until it is, or until the cap runs out, rather than
                                // uncover an empty board.
                                if (id(boot_hold_since_ms) == 0 && !id(gameday_ctl).board_ready())
                                  id(boot_hold_since_ms) = millis() == 0 ? 1 : millis();
                                return id(gameday_ctl).boot_hold(id(boot_hold_since_ms));
                            then:
                              - component.resume: boot_check
                              - component.resume: boot_anim
                              - script.execute: boot_hold_view
                              - lvgl.obj.update:
                                  id: boot_overlay
                                  hidden: false
                            else:
                              - lambda: 'id(boot_hold_since_ms) = 0;'
                              - component.suspend: boot_check
                              - component.suspend: boot_anim
                              - script.execute:
                                  id: boot_qr_cycle
                                  owner: 0
                                  extra: false
                              - lvgl.obj.update:
                                  id: boot_overlay
                                  hidden: true

  # Boot button: bring the address back for 20 seconds
  - id: boot_show_address
    mode: restart
    then:
      - script.execute:
          id: boot_refresh
          via_button: true
      - lvgl.obj.update:
          id: boot_overlay
          hidden: false
      - delay: 20s
      - script.execute: boot_hide

  # Boot button held down, timed from the press. Nothing is erased while the
  # button is down: the hold picks what happens and letting go does it
  # (on_release below), so the owner reads the screen before anything is
  # gone and can still back out.
  #   1.5 s  stage 1: the address, as before
  #   5 s    stage 2: Keep holding / Wi-Fi reset / in 5s, the bar filling
  #   10 s   stage 3: Release to / reset Wi-Fi / Hold 10s to / erase all
  #   20 s   stage 4: Release to / erase all / Hold 10s to / cancel
  #   30 s   stage 5: Release to / cancel
  # Letting go in stage 2 or 5 goes back to the address and resets nothing.
  # Stage 6 is a reset on its way, until the restart.
  - id: boot_hold_tick
    then:
      - lambda: |-
          if (id(boot_button_press_ms) == 0 || id(boot_hold_stage) == 6) return;
          const uint32_t held = millis() - id(boot_button_press_ms);
          if (held < 5000) {
            if (held >= 1500 && id(boot_hold_stage) < 1) {
              id(boot_hold_stage) = 1;
              // A panel switched off with a click would show none of this.
              if (!id(power).state) id(power).turn_on();
              id(boot_show_address).execute();
            }
            return;
          }
          const int stage = held >= 30000 ? 5 : held >= 20000 ? 4 : held >= 10000 ? 3 : 2;
          // Whole seconds left in this stage, so the countdown reads 10..1.
          const uint32_t stage_end = stage == 2 ? 10000 : stage == 3 ? 20000 : 30000;
          const unsigned left = stage == 5 ? 0 : (unsigned) ((stage_end - held + 999) / 1000);
          static int shown = -1;
          if (id(boot_hold_stage) < 2) {
            shown = -1;
            // component.suspend maps to stop_poller() on a PollingComponent;
            // there is no suspend() method to call from a lambda.
            id(boot_anim).stop_poller();
            // boot_check repaints the overlay twice a second. On a panel
            // whose overlay is still up (first boot, or the 45s setup hint)
            // it would overwrite this warning as fast as we draw it. It is
            // not resumed on release: boot_show_address ends in boot_hide,
            // which suspends it anyway, so this is where it would land. The
            // exception is an outage, where boot_hide resumes it instead of
            // hiding, which is what keeps the Wi-Fi lost lines coming back.
            id(boot_check).stop_poller();
            // The QR would cover the warning, and with boot_check stopped
            // nothing else would take it down. Full width, so the warning
            // is not squeezed into half a chain.
            id(boot_qr_cycle).execute(0, false);
            id(boot_view).execute(false, false);
          }
          if (stage != id(boot_hold_stage)) {
            static const char *const LOG[] = {"keep holding for a Wi-Fi reset", "release to reset Wi-Fi",
                                              "release to factory reset", "release to cancel"};
            ESP_LOGI("boot", "Button held %us: %s", (unsigned) (held / 1000), LOG[stage - 2]);
            id(boot_hold_stage) = stage;
          }
          // Lines only when the stage or the count changes; the bar every tick.
          const int key = stage * 100 + (int) left;
          if (key != shown) {
            shown = key;
            char n[16];
            if (stage == 2) {
              snprintf(n, sizeof(n), "in %us", left);
              id(boot_set_lines).execute("Keep holding", "Wi-Fi reset", n, "", true);
            } else if (stage == 3) {
              snprintf(n, sizeof(n), "Hold %us to", left);
              id(boot_set_lines).execute("Release to", "reset Wi-Fi", n, "erase all", false);
            } else if (stage == 4) {
              snprintf(n, sizeof(n), "Hold %us to", left);
              id(boot_set_lines).execute("Release to", "erase all", n, "cancel", false);
            } else {
              id(boot_set_lines).execute("Release to", "cancel", "", "", false);
            }
          }
          if (stage == 2) {
            int pct = (int) ((held - 5000) / 50);  // 5000ms span -> 0..100
            if (pct > 100) pct = 100;
            lv_bar_set_value(id(boot_bar), pct, LV_ANIM_OFF);
          }

  # Wi-Fi went away. Undo boot_hide, cancel any pending hide, and say what
  # happened instead of leaving a stale score on the board. Bluetooth is
  # switched back on by the wifi: on_disconnect handler so the app can find
  # the panel again, exactly as it does on a fresh unit.
  - id: boot_wifi_lost
    then:
      # boot_refresh only arms the hide timer when boot_ip_shown_ms is 0, so
      # clearing it lets the overlay hide itself again normally once Wi-Fi
      # comes back. What keeps the lines below on the screen is boot_refresh
      # deriving the same lost state from the Wi-Fi component on its next
      # 500ms tick; this script only exists to paint them now instead of up to
      # half a second from now.
      - lambda: |-
          id(boot_ip_shown_ms) = 0;
          id(boot_hold_since_ms) = 0;
      # Stages 2 and up are the boot button's countdown, which owns both the
      # lines and the bar and stopped boot_check for exactly this reason. Do
      # not repaint over a screen that says what letting go will erase.
      # boot_refresh derives these same lines when it next runs.
      - if:
          condition:
            lambda: 'return id(boot_hold_stage) < 2;'
          then:
            - component.resume: boot_check
            - component.resume: boot_anim
            - script.stop: boot_hide_later
            - lvgl.obj.update:
                id: boot_overlay
                hidden: false
            - lambda: |-
                // Same lines and layout as boot_refresh's lost branch, on
                // its first frame: text on 64, QR beside the text on 128.
                const bool wide = lv_disp_get_hor_res(lv_disp_get_default()) >= 128;
                id(boot_qr_cycle).execute(0, false);
                id(boot_view).execute(wide, wide);
                id(boot_set_lines).execute("Wi-Fi", "lost", "open app", "", true);

  # A panel nobody has picked a team on (no_team_default in the gameday
  # component) shows the app's QR code for one turn every 3 minutes, the
  # fresh panel's 13 s of QR, until a team is picked. Only over the board:
  # not while the overlay is up for anything else, during QC, or with the
  # boot button in use.
  - id: boot_app_qr_turn
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              auto *w = wifi::global_wifi_component;
              return w != nullptr && w->is_connected() && id(gameday_ctl).app_qr_turns() &&
                     id(gameday_ctl).board_ready() && !id(qc_active) &&
                     lv_obj_has_flag(id(boot_overlay), LV_OBJ_FLAG_HIDDEN) && id(boot_hold_since_ms) == 0 &&
                     id(boot_button_press_ms) == 0 && !id(boot_show_address).is_running();
          then:
            - lambda: |-
                id(boot_app_qr_on) = true;
                ESP_LOGI("boot", "No team yet: the app's QR code takes a turn");
            - component.resume: boot_check
            - script.execute:
                id: boot_refresh
                via_button: false
            - lvgl.obj.update:
                id: boot_overlay
                hidden: false
            - delay: 13s
            - lambda: 'id(boot_app_qr_on) = false;'
            # The boot button may have taken the overlay meanwhile; it hides
            # it itself.
            - if:
                condition:
                  lambda: 'return id(boot_hold_stage) == 0 && !id(boot_show_address).is_running();'
                then:
                  - script.execute: boot_hide

  # A mesh system moving the panel to another access point drops Wi-Fi for a
  # few seconds. Wait that long before covering the score, so a drop that
  # ends in time never shows. wifi: on_connect stops this script.
  - id: boot_wifi_lost_later
    mode: restart
    then:
      - delay: 10s
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - script.execute: boot_wifi_lost

interval:
  - interval: 500ms
    startup_delay: 500ms
    id: boot_check
    then:
      - script.execute:
          id: boot_refresh
          via_button: false
  - interval: 60ms
    id: boot_anim
    then:
      - lambda: |-
          id(boot_bar_value) = (id(boot_bar_value) + 3) % 130;
          int v = id(boot_bar_value) > 100 ? 100 : id(boot_bar_value);
          lv_bar_set_value(id(boot_bar), v, LV_ANIM_OFF);
  - interval: 100ms
    id: boot_hold_check
    then:
      - script.execute: boot_hold_tick
  - interval: 3min
    startup_delay: 3min
    then:
      - script.execute: boot_app_qr_turn

# Bluetooth setup (improv_ble, configured in gameday-common.yaml) starts
# advertising about a second after a boot with no saved network, and the
# Game Day app finds the panel over Bluetooth rather than someone joining the
# AP hotspot by hand. Say so on the overlay instead of leaving it on
# "Connecting" (or blank, before boot_check's first 500ms tick) while it
# waits. boot_check keeps polling the whole time, so once WiFi actually
# connects it overwrites these lines with the normal app-hint/Ready flow on
# its own; on_stop needs no action here for that reason.
improv_ble:
  on_start:
    # The overlay may already be hidden and boot_check/boot_anim suspended
    # (a panel that already had a team, or a fallback AP coming up mid-run
    # without a reboot) - undo boot_hide and cancel any pending boot_hide_later
    # so setup text isn't hidden out from under itself.
    - component.resume: boot_check
    - component.resume: boot_anim
    - script.stop: boot_hide_later
    - lvgl.obj.update:
        id: boot_overlay
        hidden: false
    # Draw the current state now rather than on the next poll. Improv also
    # starts 90 s into an outage, and this way that panel keeps saying
    # Wi-Fi lost instead of flashing SETUP.
    - script.execute:
        id: boot_refresh
        via_button: false
  on_provisioning:
    - lambda: |-
        id(boot_qr_cycle).execute(0, false);
        id(boot_view).execute(false, false);
        // Name the network the app just handed over, so a wrong pick shows here.
        const std::string joining = wifi::global_wifi_component->get_sta().get_ssid().str();
        id(boot_set_lines).execute("JOINING", joining.empty() ? std::string("Wi-Fi") : joining, "", "", true);
  on_provisioned:
    # Credentials worked; nudge boot_check's 500ms poll now instead of
    # waiting up to half a second for it to notice and repaint the
    # app-hint/Ready lines itself.
    - script.execute:
        id: boot_refresh
        via_button: false

# Boot button: the hold is timed from the press (boot_hold_tick) and the
# release does what the screen said. Let go at 10 to 20 s to reset Wi-Fi, at
# 20 to 30 s for a factory reset. Letting go any other time leaves the
# address up for 20 s and resets nothing.
binary_sensor:
  - id: !extend power_button
    on_press:
      - lambda: |-
          if (id(boot_hold_stage) == 6) return;
          id(boot_button_press_ms) = millis() == 0 ? 1 : millis();
          id(boot_hold_stage) = 0;
    on_release:
      - lambda: |-
          const int stage = id(boot_hold_stage);
          id(boot_button_press_ms) = 0;
          if (stage == 6) return;
          if (stage == 3 || stage == 4) {
            id(boot_hold_stage) = 6;
            if (stage == 3) {
              ESP_LOGI("boot", "Button released: resetting Wi-Fi");
              id(boot_set_lines).execute("Wi-Fi reset", "restarting", "", "", false);
              id(reset_wifi).press();
            } else {
              ESP_LOGI("boot", "Button released: factory reset");
              id(boot_set_lines).execute("Erasing all", "restarting", "", "", false);
              id(factory_reset_btn).press();
            }
            return;
          }
          id(boot_hold_stage) = 0;
          if (stage == 2 || stage == 5) {
            // Back out of the warning: restore the address screen and its bar.
            ESP_LOGI("boot", "Button released: nothing reset");
            id(boot_anim).start_poller();
            id(boot_show_address).execute();
          }

lvgl:
  style_definitions:
    - id: boot_st_title
      text_font: spleen_16
      text_color: 0xFFD000
    - id: boot_st_big
      text_color: 0xFFFFFF
    - id: boot_st_small
      text_color: 0xB0B8C4
  top_layer:
    widgets:
      - obj:
          id: boot_overlay
          scrollbar_mode: "OFF"
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_opa: COVER
          bg_color: 0x000000
          radius: 0
          pad_all: 0
          border_width: 0
          hidden: false
          widgets:
            - label:
                id: boot_title
                x: 0
                y: 2
                width: 128
                text_align: CENTER
                text: "GAME DAY"
                styles: [boot_st_title]
            - obj:
                id: boot_rule
                scrollbar_mode: "OFF"
                x: 4
                y: 19
                width: 120
                height: 1
                bg_opa: COVER
                bg_color: 0xFFD000
            - label:
                id: boot_la
                x: 2
                y: 22
                width: 124
                text_align: CENTER
                long_mode: SCROLL_CIRCULAR
                text: "Starting"
                styles: [boot_st_small]
            - label:
                id: boot_lb
                x: 2
                y: 31
                width: 124
                text_align: CENTER
                long_mode: SCROLL_CIRCULAR
                text: ""
                styles: [boot_st_big]
            - label:
                id: boot_lc
                x: 2
                y: 44
                width: 124
                text_align: CENTER
                long_mode: SCROLL_CIRCULAR
                text: ""
                styles: [boot_st_small]
            - label:
                id: boot_ld
                x: 2
                y: 53
                width: 124
                text_align: CENTER
                long_mode: SCROLL_CIRCULAR
                text: ""
                styles: [boot_st_small]
            - bar:
                id: boot_bar
                x: 8
                y: 61
                width: 112
                height: 3
                min_value: 0
                max_value: 100
                value: 0
                bg_opa: COVER
                bg_color: 0x202020
                indicator:
                  bg_opa: COVER
                  bg_color: 0xFFD000
            # QR code for the app. boot_view shows and hides it. Always the
            # left 64 px: the whole screen of a single panel, taking turns
            # with the lines, or the left half of a 128 px chain with the
            # lines beside it. Listed last so it draws over the lines and bar,
            # and the black box keeps them out from under the code.
            #
            # LVGL encodes it in byte mode at error correction M and picks the
            # smallest version that fits: the 35 character URL is version 3,
            # 29x29 modules (Q does not fit at version 3, so M is the
            # strongest that keeps modules this big). At 64 px that is 2 px
            # per module, 58 px, with a 3 px lit border as the quiet zone,
            # which is all that is left on a 64 px panel. Apple's barcode
            # reader decodes that offline with a dark frame right against
            # the border; bench it with a real phone before release.
            #
            # A QR wants dark modules on a light background, so the light
            # modules and the border are the lit ones. They are grey, not
            # white: most of the panel is lit on this screen, and full white
            # at a high Brightness setting blooms on camera and pulls far more
            # current than any other screen.
            - obj:
                id: boot_qr_box
                scrollbar_mode: "OFF"
                x: 0
                y: 0
                width: 64
                height: 64
                bg_opa: COVER
                bg_color: 0x000000
                radius: 0
                pad_all: 0
                border_width: 0
                hidden: true
                widgets:
                  - qrcode:
                      id: boot_qr
                      align: CENTER
                      size: 64
                      light_color: 0xA0A0A0
                      dark_color: 0x000000
                      text: "https://app.gameday-scoreboard.com/setup"

esphome:
  on_boot:
    - priority: -100.0
      then:
        - script.execute:
            id: boot_layout
            side: false
