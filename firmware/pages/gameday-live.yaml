            id: tt_fav_banner
            scrollbar_mode: "OFF"
            x: 0
            y: 48
            width: 64
            height: 16
            hidden: true
            bg_opa: COVER
            bg_color: 0x000000
            radius: 0
            pad_all: 0
            border_width: 0
            widgets:
              - label:
                  id: tt_fav_banner_lbl
                  x: 0
                  y: 0
                  width: 64
                  text_align: CENTER
                  long_mode: SCROLL_CIRCULAR
                  text: ""
                  text_color: 0xFFFFFF

        # Full-screen score splash (TOUCHDOWN! etc), shown briefly on scores
        - obj:
            id: tt_splash
            scrollbar_mode: "OFF"
            x: 0
            y: 0
            width: 64
            height: 64
            hidden: true
            bg_opa: COVER
            bg_color: 0x000000
