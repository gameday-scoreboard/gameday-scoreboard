              - canvas:
                  id: tt_fx_canvas
                  x: 0
                  y: 0
                  width: 128
                  height: 64
                  hidden: true
              - label:
                  id: tt_splash_lbl
                  x: 0
                  y: 16
                  width: 64
                  text_align: CENTER
                  long_mode: WRAP
                  text: ""
                  styles: ["tt_st_score_text"]

