          lv_obj_clear_flag(id(tt_news), LV_OBJ_FLAG_HIDDEN);

  # The weather card (components/gameday/weather.h), from the board's last
  # update: the icon and the temperature now, today's high and low, the
  # words for the sky, and the next two days small underneath. The ticker
  # keeps the bottom row, as under the clock and the countdown.
  - id: gd_wx_card
    then:
      - lambda: |-
          const gameday::UpdateFields &u = id(gameday_ctl).last_update();
          const int W = lv_disp_get_hor_res(lv_disp_get_default());
          const bool wide = W >= 128;
          const int x0 = (W - (wide ? 128 : 64)) / 2;  // a longer chain centers the card
          image::Image *big[8] = {id(gd_wx16_cloud), id(gd_wx16_sun),  id(gd_wx16_moon), id(gd_wx16_part),
                                  id(gd_wx16_fog),   id(gd_wx16_rain), id(gd_wx16_snow), id(gd_wx16_storm)};
          image::Image *small[8] = {id(gd_wx8_cloud), id(gd_wx8_sun),  id(gd_wx8_moon), id(gd_wx8_part),
                                    id(gd_wx8_fog),   id(gd_wx8_rain), id(gd_wx8_snow), id(gd_wx8_storm)};
          auto put = [](lv_obj_t *lbl, const std::string &text) {
            const char *cur = lv_label_get_text(lbl);
            if (cur == nullptr || text != cur)
              lv_label_set_text(lbl, text.c_str());
          };
          lv_obj_set_size(id(gd_wx), W, 54);
          lv_image_set_src(id(gd_wx_icon), big[u.wx_icon % 8]);
          lv_image_set_src(id(gd_wx_d1_icon), small[u.wx_d1_icon % 8]);
          lv_image_set_src(id(gd_wx_d2_icon), small[u.wx_d2_icon % 8]);
          put(id(gd_wx_temp_lbl), ::espn::wx_temp_text(u.wx_temp));
          put(id(gd_wx_words_lbl), u.wx_words);
          put(id(gd_wx_d1_lbl), u.wx_d1);
          put(id(gd_wx_d1_hilo_lbl), u.wx_d1_hilo);
          put(id(gd_wx_d2_lbl), u.wx_d2);
          put(id(gd_wx_d2_hilo_lbl), u.wx_d2_hilo);
          lv_obj_set_width(id(gd_wx_words_lbl), W);
          if (wide) {
            // 128x64: the icon, the temperature in 16x32 and today's high and
            // low beside it; the words; the next two days side by side.
            put(id(gd_wx_hi_lbl), "Hi " + std::to_string(u.wx_hi));
            put(id(gd_wx_lo_lbl), "Lo " + std::to_string(u.wx_lo));
            lv_obj_set_pos(id(gd_wx_icon), x0 + 4, 8);
            lv_obj_set_style_text_font(id(gd_wx_temp_lbl), id(spleen_32)->get_lv_font(), 0);
            lv_obj_set_pos(id(gd_wx_temp_lbl), x0 + 24, 0);
            lv_obj_set_width(id(gd_wx_temp_lbl), 54);
            lv_obj_set_style_text_font(id(gd_wx_hi_lbl), id(spleen_12)->get_lv_font(), 0);
            lv_obj_set_style_text_align(id(gd_wx_hi_lbl), LV_TEXT_ALIGN_LEFT, 0);
            lv_obj_set_pos(id(gd_wx_hi_lbl), x0 + 80, 4);
            lv_obj_set_width(id(gd_wx_hi_lbl), 46);
            lv_obj_set_pos(id(gd_wx_lo_lbl), x0 + 80, 18);
            lv_obj_clear_flag(id(gd_wx_lo_lbl), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_text_font(id(gd_wx_words_lbl), id(spleen_12)->get_lv_font(), 0);
            lv_obj_set_y(id(gd_wx_words_lbl), 33);
            lv_obj_set_pos(id(gd_wx_d1_lbl), x0 + 2, 46);
            lv_obj_set_pos(id(gd_wx_d1_icon), x0 + 19, 46);
            lv_obj_set_pos(id(gd_wx_d1_hilo_lbl), x0 + 29, 46);
            lv_obj_set_pos(id(gd_wx_d2_lbl), x0 + 66, 46);
            lv_obj_set_pos(id(gd_wx_d2_icon), x0 + 83, 46);
            lv_obj_set_pos(id(gd_wx_d2_hilo_lbl), x0 + 93, 46);
          } else {
            // 64x64: the icon and the temperature in 8x16, the words, today's
            // high and low on one line, then a line for each next day.
            put(id(gd_wx_hi_lbl), "Hi " + std::to_string(u.wx_hi) + " Lo " + std::to_string(u.wx_lo));
            lv_obj_set_pos(id(gd_wx_icon), x0 + 2, 1);
            lv_obj_set_style_text_font(id(gd_wx_temp_lbl), id(spleen_16)->get_lv_font(), 0);
            lv_obj_set_pos(id(gd_wx_temp_lbl), x0 + 22, 1);
            lv_obj_set_width(id(gd_wx_temp_lbl), 42);
            lv_obj_set_style_text_font(id(gd_wx_hi_lbl), id(spleen_8)->get_lv_font(), 0);
            lv_obj_set_style_text_align(id(gd_wx_hi_lbl), LV_TEXT_ALIGN_CENTER, 0);
            lv_obj_set_pos(id(gd_wx_hi_lbl), 0, 27);
            lv_obj_set_width(id(gd_wx_hi_lbl), W);
            lv_obj_add_flag(id(gd_wx_lo_lbl), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_text_font(id(gd_wx_words_lbl), id(spleen_8)->get_lv_font(), 0);
            lv_obj_set_y(id(gd_wx_words_lbl), 18);
            lv_obj_set_pos(id(gd_wx_d1_lbl), x0 + 2, 37);
            lv_obj_set_pos(id(gd_wx_d1_icon), x0 + 19, 37);
            lv_obj_set_pos(id(gd_wx_d1_hilo_lbl), x0 + 29, 37);
            lv_obj_set_pos(id(gd_wx_d2_lbl), x0 + 2, 46);
            lv_obj_set_pos(id(gd_wx_d2_icon), x0 + 19, 46);
            lv_obj_set_pos(id(gd_wx_d2_hilo_lbl), x0 + 29, 46);
          }
          lv_obj_clear_flag(id(gd_wx), LV_OBJ_FLAG_HIDDEN);

  # The picture card (components/gameday/picture.h): the owner's picture,
  # centered on black, at half size when it is wider than the display, or
  # nothing. The component owns the pixels; this points the image at them.
  # The build keeps no LVGL image cache (LV_CACHE_DEF_SIZE 0), so nothing
  # holds on to a canvas the component has freed.
  - id: gd_picture_card
    then:
      - lambda: |-
          static lv_image_dsc_t dsc;
          if (!id(gameday_ctl).picture_shown()) {
            lv_obj_add_flag(id(tt_picture), LV_OBJ_FLAG_HIDDEN);
            lv_image_set_src(id(tt_picture_img), id(gd_logo_blank)->get_lv_image_dsc());
            return;
          }
          const int32_t W = lv_display_get_horizontal_resolution(lv_display_get_default());
          const uint16_t w = id(gameday_ctl).picture_width(), h = id(gameday_ctl).picture_height();
          memset(&dsc, 0, sizeof(dsc));
          dsc.header.magic = LV_IMAGE_HEADER_MAGIC;
          dsc.header.cf = LV_COLOR_FORMAT_RGB565;
          dsc.header.w = w;
          dsc.header.h = h;
          dsc.header.stride = w * 2;
          dsc.data = id(gameday_ctl).picture_pixels();
          dsc.data_size = (uint32_t) w * h * 2;
          lv_obj_set_size(id(tt_picture), W, 64);
          lv_image_set_src(id(tt_picture_img), &dsc);
          lv_obj_set_size(id(tt_picture_img), w, h);
          lv_image_set_pivot(id(tt_picture_img), w / 2, h / 2);
          lv_image_set_scale(id(tt_picture_img), ::espn::pic_scale(w, W));
          lv_obj_center(id(tt_picture_img));
          lv_obj_move_foreground(id(tt_picture));
          lv_obj_clear_flag(id(tt_picture), LV_OBJ_FLAG_HIDDEN);

  # The off-season clock's time, and the date when that line has no next
  # game, in the panel's time zone; or the countdown card's digits. A label
  # is only rewritten when its text changes, so once a minute.
  - id: gd_clock_tick
    then:
      - lambda: |-
          bool countdown = !lv_obj_has_flag(id(gd_countdown_lbl), LV_OBJ_FLAG_HIDDEN);
          if (!countdown && lv_obj_has_flag(id(gd_clock_time_lbl), LV_OBJ_FLAG_HIDDEN))
            return;
          ESPTime now = id(ha_time).now();
          if (!now.is_valid())
            return;
          auto put = [](lv_obj_t *lbl, const std::string &text) {
            const char *cur = lv_label_get_text(lbl);
            if (cur == nullptr || text != cur)
              lv_label_set_text(lbl, text.c_str());
          };
          if (countdown) {
            put(id(gd_countdown_lbl),
                ::espn::countdown_card_text(id(gd_countdown_at), id(gd_countdown_end), (int64_t) now.timestamp));
            return;
          }
          struct tm t = now.to_c_tm();
          put(id(gd_clock_time_lbl), ::espn::clock_time_text(t));
          if (id(gd_clock_date))
            put(id(gd_clock_sub_lbl), ::espn::clock_date_text(t));

  # The multi-game board (components/gameday/tiles.cpp, multi_board.h): the
  # component's tiles() laid out for this display and filled in. Two games
  # are 64x64 tiles (logos over scores, like the single-panel board, with a
  # bar in each team's color); four on one panel are 64x32 tiles with an
  # abbreviation badge per side. A tile whose side just scored flashes in
  # that team's color (gd_tiles_unflash puts it back). Run by the tiles
  # action and again when a logo arrives.
  - id: gd_tiles
    then:
      - lambda: |-
          const auto &b = id(gameday_ctl).tiles();
          if (b.count <= 1) {
            lv_obj_add_flag(id(tt_tiles), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          const int W = lv_disp_get_hor_res(lv_disp_get_default());
          ::espn::TileGrid grid = ::espn::tile_grid(b.count, W);
          const bool tall = grid.tile_h >= 64;
          lv_obj_set_size(id(tt_tiles), W, 64);
          struct Objs {
            lv_obj_t *tile, *al, *hl, *ab, *abl, *hb, *hbl, *ac, *hc, *as, *hs, *st, *ap, *hp;
          };
          Objs o[4] = {
              {id(gd_tile_0), id(gd_tile_0_al), id(gd_tile_0_hl), id(gd_tile_0_ab), id(gd_tile_0_abl), id(gd_tile_0_hb),
               id(gd_tile_0_hbl), id(gd_tile_0_ac), id(gd_tile_0_hc), id(gd_tile_0_as), id(gd_tile_0_hs), id(gd_tile_0_st),
               id(gd_tile_0_ap), id(gd_tile_0_hp)},
              {id(gd_tile_1), id(gd_tile_1_al), id(gd_tile_1_hl), id(gd_tile_1_ab), id(gd_tile_1_abl), id(gd_tile_1_hb),
               id(gd_tile_1_hbl), id(gd_tile_1_ac), id(gd_tile_1_hc), id(gd_tile_1_as), id(gd_tile_1_hs), id(gd_tile_1_st),
               id(gd_tile_1_ap), id(gd_tile_1_hp)},
              {id(gd_tile_2), id(gd_tile_2_al), id(gd_tile_2_hl), id(gd_tile_2_ab), id(gd_tile_2_abl), id(gd_tile_2_hb),
               id(gd_tile_2_hbl), id(gd_tile_2_ac), id(gd_tile_2_hc), id(gd_tile_2_as), id(gd_tile_2_hs), id(gd_tile_2_st),
               id(gd_tile_2_ap), id(gd_tile_2_hp)},
              {id(gd_tile_3), id(gd_tile_3_al), id(gd_tile_3_hl), id(gd_tile_3_ab), id(gd_tile_3_abl), id(gd_tile_3_hb),
               id(gd_tile_3_hbl), id(gd_tile_3_ac), id(gd_tile_3_hc), id(gd_tile_3_as), id(gd_tile_3_hs), id(gd_tile_3_st),
               id(gd_tile_3_ap), id(gd_tile_3_hp)},
          };
          auto show = [](lv_obj_t *obj, bool on) {
            if (on)
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };
          auto put = [](lv_obj_t *lbl, const std::string &text) {
            const char *cur = lv_label_get_text(lbl);
            if (cur == nullptr || text != cur)
              lv_label_set_text(lbl, text.c_str());
          };
          // Dark team colors vanish on the panel: lift them to full brightness.
          auto bright = [](uint32_t c) -> uint32_t {
            uint32_t r = (c >> 16) & 0xFF, g = (c >> 8) & 0xFF, bl = c & 0xFF;
            uint32_t m = std::max(r, std::max(g, bl));
            if (m == 0)
              return 0xFFFFFF;
            if (m < 0xC0) {
              r = r * 0xC0 / m;
              g = g * 0xC0 / m;
              bl = bl * 0xC0 / m;
            }
            return (r << 16) | (g << 8) | bl;
          };
          auto &logos = id(gameday_ctl).logos();
          const lv_font_t *f8 = id(spleen_8)->get_lv_font();
          const lv_font_t *f12 = id(spleen_12)->get_lv_font();
          const lv_font_t *f16 = id(spleen_16)->get_lv_font();
          bool flashed = false;
          for (int i = 0; i < 4; i++) {
            Objs &w = o[i];
            if (i >= b.count) {
              show(w.tile, false);
              continue;
            }
            const int col = i % grid.cols, row = i / grid.cols;
            lv_obj_set_pos(w.tile, col * grid.tile_w, row * grid.tile_h);
            lv_obj_set_size(w.tile, grid.tile_w, grid.tile_h);
            show(w.tile, true);
            const auto &t = b.tiles[i];
            lv_obj_t *all[] = {w.al, w.hl, w.ab, w.hb, w.ac, w.hc, w.as, w.hs, w.st, w.ap, w.hp};
            if (!t.used) {
              for (lv_obj_t *x : all)
                show(x, false);
              lv_obj_set_style_bg_color(w.tile, lv_color_hex(0x000000), 0);
              continue;
            }
            // A badge in the team's color, with the abbreviation on it (badge.h).
            auto badge = [&](lv_obj_t *box, lv_obj_t *lbl, const std::string &abbr, uint32_t color, int x, int y, int bw,
                             int bh, int radius, const lv_font_t *font) {
              ::espn::BadgeStyle st = ::espn::badge_style(color, color);
              lv_obj_set_pos(box, x, y);
              lv_obj_set_size(box, bw, bh);
              lv_obj_set_style_radius(box, radius, 0);
              lv_obj_set_style_bg_color(box, lv_color_hex(st.fill), 0);
              lv_obj_set_style_border_width(box, st.has_ring ? 1 : 0, 0);
              lv_obj_set_style_border_color(box, lv_color_hex(st.ring), 0);
              lv_obj_set_style_text_font(lbl, font, 0);
              lv_obj_set_style_text_color(lbl, lv_color_hex(st.dark_text ? 0x000000 : 0xFFFFFF), 0);
              put(lbl, abbr);
              show(box, true);
            };
            if (tall) {
              const int cx = grid.tile_w / 2;
              // Logos, or badges while a logo is missing.
              auto slot = [&](lv_obj_t *img, lv_obj_t *box, lv_obj_t *lbl, const std::string &url,
                              const std::string &abbr, uint32_t color, int x) {
                image::Image *im = url.empty() ? nullptr : logos.get(url);
                if (im != nullptr) {
                  lv_obj_set_pos(img, x, 2);
                  lv_image_set_src(img, im);
                  show(img, true);
                  show(box, false);
                } else {
                  show(img, false);
                  badge(box, lbl, abbr, color, x, 2, 32, 32, 8, f12);
                }
              };
              slot(w.al, w.ab, w.abl, t.away_logo, t.away_abbr, t.away_color, cx - 32);
              slot(w.hl, w.hb, w.hbl, t.home_logo, t.home_abbr, t.home_color, cx);
              // A bar in each team's color under its logo.
              lv_obj_set_pos(w.ac, cx - 32, 35);
              lv_obj_set_size(w.ac, 32, 2);
              lv_obj_set_style_bg_color(w.ac, lv_color_hex(bright(t.away_color)), 0);
              lv_obj_set_pos(w.hc, cx, 35);
              lv_obj_set_size(w.hc, 32, 2);
              lv_obj_set_style_bg_color(w.hc, lv_color_hex(bright(t.home_color)), 0);
              show(w.ac, true);
              show(w.hc, true);
              // Scores, big, then the status line.
              for (lv_obj_t *l : {w.as, w.hs}) {
                lv_obj_set_style_text_font(l, f16, 0);
                lv_obj_set_style_text_align(l, LV_TEXT_ALIGN_CENTER, 0);
                lv_obj_set_width(l, 32);
              }
              lv_obj_set_pos(w.as, cx - 32, 38);
              lv_obj_set_pos(w.hs, cx, 38);
              lv_obj_set_style_text_font(w.st, f8, 0);
              lv_obj_set_pos(w.st, 0, 56);
              lv_obj_set_width(w.st, grid.tile_w);
              // Possession: a gold dot at the outer edge of the score row.
              lv_obj_set_size(w.ap, 3, 3);
              lv_obj_set_size(w.hp, 3, 3);
              lv_obj_set_pos(w.ap, cx - 31, 45);
              lv_obj_set_pos(w.hp, cx + 28, 45);
            } else {
              // 64x32: a pill badge per side with the score beside it, the
              // status under both. No logos: 16 px of ESPN logo is mush.
              show(w.al, false);
              show(w.hl, false);
              show(w.ac, false);
              show(w.hc, false);
              badge(w.ab, w.abl, t.away_abbr, t.away_color, 1, 1, 26, 10, 3, f8);
              badge(w.hb, w.hbl, t.home_abbr, t.home_color, 1, 12, 26, 10, 3, f8);
              for (lv_obj_t *l : {w.as, w.hs}) {
                lv_obj_set_style_text_font(l, f12, 0);
                lv_obj_set_style_text_align(l, LV_TEXT_ALIGN_RIGHT, 0);
                lv_obj_set_width(l, 25);
              }
              lv_obj_set_pos(w.as, 29, 0);
              lv_obj_set_pos(w.hs, 29, 11);
              lv_obj_set_style_text_font(w.st, f8, 0);
              lv_obj_set_pos(w.st, 0, 23);
              lv_obj_set_width(w.st, grid.tile_w);
              lv_obj_set_size(w.ap, 3, 3);
              lv_obj_set_size(w.hp, 3, 3);
              lv_obj_set_pos(w.ap, 57, 4);
              lv_obj_set_pos(w.hp, 57, 15);
            }
            // A game to come has no score yet: each side's record, or a dash.
            const bool scored = t.live || t.status == "F" || t.status.compare(0, 2, "F/") == 0;
            put(w.as, scored ? std::to_string(t.away_score) : t.away_record.empty() ? "-" : t.away_record);
            put(w.hs, scored ? std::to_string(t.home_score) : t.home_record.empty() ? "-" : t.home_record);
            // Records are long for the big digits: spleen_12 fits "10-4" in 32 px.
            if (tall && !scored) {
              lv_obj_set_style_text_font(w.as, f12, 0);
              lv_obj_set_style_text_font(w.hs, f12, 0);
            }
            show(w.as, true);
            show(w.hs, true);
            put(w.st, t.status);
            lv_obj_set_style_text_color(w.st, lv_color_hex(t.live ? 0xE0E0E0 : 0x909090), 0);
            lv_obj_set_style_text_align(w.st, LV_TEXT_ALIGN_CENTER, 0);
            show(w.st, true);
            show(w.ap, t.possession == 1);
            show(w.hp, t.possession == 2);
            if (t.flash != 0) {
              lv_obj_set_style_bg_color(w.tile, lv_color_hex(bright(t.flash == 1 ? t.away_color : t.home_color)), 0);
              flashed = true;
            } else {
              lv_obj_set_style_bg_color(w.tile, lv_color_hex(0x000000), 0);
            }
          }
          lv_obj_clear_flag(id(tt_tiles), LV_OBJ_FLAG_HIDDEN);
          if (flashed)
            id(gd_tiles_unflash).execute();

  - id: gd_tiles_unflash
    mode: restart
    then:
      - delay: 1200ms
      - lambda: |-
          for (lv_obj_t *tile : {id(gd_tile_0), id(gd_tile_1), id(gd_tile_2), id(gd_tile_3)})
            lv_obj_set_style_bg_color(tile, lv_color_hex(0x000000), 0);

interval:
  - interval: 1s
    then:
      - script.execute: gd_clock_tick
  # The cards' turns on the board, 10 s each: the board (0), the line score
  # (1) and the game leaders (2), skipping a card that is not ready. The
  # board always comes first, and the halftime leaders card has one turn,
  # counted as it ends: until then the polls in its 10 s keep it laid out.
  - interval: 10s
    then:
      - lambda: |-
          if (!id(gd_line_ready) && !id(gd_leaders_ready))
            return;
          const int prev = id(gd_card_turn);
          int next = prev;
          for (int i = 0; i < 3; i++) {
            next = (next + 1) % 3;
            if (next == 0 || (next == 1 && id(gd_line_ready)) ||
                (next == 2 && id(gd_leaders_ready) && id(gameday_ctl).leaders_card_due()))
              break;
          }
          id(gd_card_turn) = next;
          if (next == 1)
            lv_obj_clear_flag(id(tt_line), LV_OBJ_FLAG_HIDDEN);
          else
            lv_obj_add_flag(id(tt_line), LV_OBJ_FLAG_HIDDEN);
          if (next == 2) {
            lv_obj_clear_flag(id(tt_leaders), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(tt_leaders), LV_OBJ_FLAG_HIDDEN);
            if (prev == 2)
              id(gameday_ctl).leaders_turn_taken();
          }

globals:
  # The board has a line score (halftime or a final), the game leaders card
  # (game_leaders.h), and whose turn it is: 0 the board, 1 the line score,
  # 2 the leaders.
  - id: gd_line_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: gd_leaders_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: gd_card_turn
    type: int
    restore_value: no
    initial_value: '0'

