# WizMote remote support. Adapted from hub75-studio's packages/common/wizmote.yaml
# (MIT, Stuart Parmenter): same ESP-NOW pairing and brightness handling, but the
# four numbered buttons pick favorite teams instead of pages.
#
# Buttons: ON/OFF = panel power, 1-4 = favorite teams, brightness up/down,
# NIGHT = dim to the night level. In the demo build 1-4 run the demo instead
# (remote_number in components/gameday/demo.cpp).

substitutions:
  WIZMOTE_MAC_ADDRESS: "00:00:00:00:00:00"
  WIZMOTE_BRIGHTNESS_STEP: "10"
  WIZMOTE_BRIGHTNESS_MIN_STEP: "5"
  WIZMOTE_BRIGHTNESS_NIGHT: "20"

globals:
  - id: wizmote_last_sequence
    type: int
    initial_value: '0'
  - id: wizmote_previous_mac
    type: std::string
    initial_value: '""'

script:
  - id: process_wizmote_button
    parameters:
      button: int
    then:
      - if:
          condition:
            lambda: 'return button >= 16 && button <= 19;'
          then:
            # A favorite on a dark panel is somebody asking to see that team.
            - if:
                condition:
                  switch.is_off: power
                then:
                  - switch.turn_on: power
            - lambda: 'id(gameday_ctl).remote_number(button - 15);'
      - if:
          condition:
            lambda: 'return button == 1;'
          then:
            - switch.turn_on: power
      - if:
          condition:
            lambda: 'return button == 2;'
          then:
            - switch.turn_off: power
      - if:
          # Brighter on a panel that is off means turn it on. The first press
          # brings back the brightness it was set to; stepping up as well
          # would jump straight past it.
          condition:
            lambda: 'return button == 9;'
          then:
            - if:
                condition:
                  switch.is_off: power
                then:
                  - switch.turn_on: power
                else:
                  - lambda: |-
                      float current = id(brightness).state;
                      float step = std::max((float) ${WIZMOTE_BRIGHTNESS_MIN_STEP}, 255.0f * ${WIZMOTE_BRIGHTNESS_STEP} / 100.0f);
                      auto call = id(brightness).make_call();
                      call.set_value(std::min(255.0f, current + step));
                      call.perform();
      - if:
          # Dimmer does nothing on a panel that is off. Otherwise mashing it in
          # the dark walks the saved level down to 1, and the next power on
          # comes back as good as invisible.
          condition:
            lambda: 'return button == 8;'
          then:
            - if:
                condition:
                  switch.is_on: power
                then:
                  - lambda: |-
                      float current = id(brightness).state;
                      float step = std::max((float) ${WIZMOTE_BRIGHTNESS_MIN_STEP}, 255.0f * ${WIZMOTE_BRIGHTNESS_STEP} / 100.0f);
                      auto call = id(brightness).make_call();
                      call.set_value(std::max(1.0f, current - step));
                      call.perform();
      - if:
          condition:
            lambda: 'return button == 3;'
          then:
            # NIGHT on a dark panel turns it on at the night level: power
            # first, then the number, which the switch then lets through.
            - if:
                condition:
                  switch.is_off: power
                then:
                  - switch.turn_on: power
            - lambda: |-
                auto call = id(brightness).make_call();
                call.set_value(${WIZMOTE_BRIGHTNESS_NIGHT});
                call.perform();

espnow:
  id: espnow_component
  auto_add_peer: false
  enable_on_boot: true
  on_unknown_peer:
    then:
      - lambda: |-
          char mac_str[18];
          snprintf(mac_str, sizeof(mac_str), "%02x:%02x:%02x:%02x:%02x:%02x",
                   info.src_addr[0], info.src_addr[1], info.src_addr[2],
                   info.src_addr[3], info.src_addr[4], info.src_addr[5]);
          std::string sender_mac = mac_str;
          if (size != 13)
            return;
          if (id(wizmote_discovery_mode).state) {
            std::string current_mac = id(wizmote_mac_address).state;
            if (current_mac != sender_mac) {
              ESP_LOGI("wizmote", "Discovered WizMote %s", sender_mac.c_str());
              auto call = id(wizmote_mac_address).make_call();
              call.set_value(sender_mac);
              call.perform();
              id(wizmote_discovery_mode).turn_off();
            }
            return;
          }
          ESP_LOGI("wizmote", "Unpaired WizMote %s pressed a button (turn on discovery to pair)", sender_mac.c_str());
  on_broadcast:
    then:
      - lambda: |-
          if (size != 13)
            return;
          char mac_str[18];
          snprintf(mac_str, sizeof(mac_str), "%02x:%02x:%02x:%02x:%02x:%02x",
                   info.src_addr[0], info.src_addr[1], info.src_addr[2],
                   info.src_addr[3], info.src_addr[4], info.src_addr[5]);
          std::string sender_mac = mac_str;
          std::string configured_mac = id(wizmote_mac_address).state;
          std::transform(configured_mac.begin(), configured_mac.end(), configured_mac.begin(), ::tolower);
          if (configured_mac == "00:00:00:00:00:00" || configured_mac.empty() || sender_mac != configured_mac)
            return;
          // data[1..4] sequence (little endian), data[6] button
          uint32_t sequence = (data[4] << 24) | (data[3] << 16) | (data[2] << 8) | data[1];
          uint8_t button = data[6];
          if ((int) sequence == id(wizmote_last_sequence))
            return;
          id(wizmote_last_sequence) = sequence;
          ESP_LOGI("wizmote", "Button %d", button);
          id(process_wizmote_button).execute(button);

text:
  - platform: template
    name: "WizMote MAC Address"
    id: wizmote_mac_address
    icon: "mdi:remote"
    entity_category: config
    initial_value: "${WIZMOTE_MAC_ADDRESS}"
    optimistic: true
    restore_value: true
    mode: text
    min_length: 17
    max_length: 17
    on_value:
      - lambda: |-
          bool valid = true;
          for (int i = 0; i < 17; i++) {
            if (i % 3 == 2 ? x[i] != ':' : !std::isxdigit((unsigned char) x[i]))
              valid = false;
          }
          if (!valid)
            ESP_LOGW("wizmote", "Invalid MAC %s (expected aa:bb:cc:dd:ee:ff)", x.c_str());
      - if:
          condition:
            lambda: 'return id(wizmote_previous_mac) != "" && id(wizmote_previous_mac) != "00:00:00:00:00:00";'
          then:
            - espnow.peer.delete:
                address: !lambda |-
                  std::array<uint8_t, 6> mac_bytes{};
                  sscanf(id(wizmote_previous_mac).c_str(), "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
                         &mac_bytes[0], &mac_bytes[1], &mac_bytes[2], &mac_bytes[3], &mac_bytes[4], &mac_bytes[5]);
                  return mac_bytes;
      - if:
          condition:
            lambda: 'return x != "00:00:00:00:00:00" && x != "";'
          then:
            - espnow.peer.add:
                address: !lambda |-
                  std::array<uint8_t, 6> mac_bytes{};
                  sscanf(x.c_str(), "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
                         &mac_bytes[0], &mac_bytes[1], &mac_bytes[2], &mac_bytes[3], &mac_bytes[4], &mac_bytes[5]);
                  return mac_bytes;
            - logger.log:
                format: "WizMote paired: %s"
                args: ['x.c_str()']
      - lambda: 'id(wizmote_previous_mac) = x;'
      - lambda: 'id(wizmote_status).update();'

button:
  - platform: template
    name: "Clear WizMote Pairing"
    id: wizmote_clear_button
    icon: "mdi:close-circle"
    entity_category: config
    on_press:
      - lambda: |-
          std::string mac = id(wizmote_mac_address).state;
          if (mac != "00:00:00:00:00:00" && mac.length() == 17) {
            std::array<uint8_t, 6> mac_bytes{};
            if (sscanf(mac.c_str(), "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
                       &mac_bytes[0], &mac_bytes[1], &mac_bytes[2], &mac_bytes[3], &mac_bytes[4], &mac_bytes[5]) == 6)
              id(espnow_component).del_peer(mac_bytes.data());
          }
          id(wizmote_mac_address).publish_state("00:00:00:00:00:00");
      - lambda: 'id(wizmote_status).update();'

esphome:
  on_boot:
    - priority: -200
      then:
        - delay: 2s
        - if:
            condition:
              lambda: |-
                std::string mac = id(wizmote_mac_address).state;
                return mac != "00:00:00:00:00:00" && mac != "";
            then:
              - espnow.peer.add:
                  address: !lambda |-
                    std::array<uint8_t, 6> mac_bytes{};
                    sscanf(id(wizmote_mac_address).state.c_str(), "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
                           &mac_bytes[0], &mac_bytes[1], &mac_bytes[2], &mac_bytes[3], &mac_bytes[4], &mac_bytes[5]);
                    return mac_bytes;
              - logger.log:
                  format: "WizMote pairing restored: %s"
                  args: ['id(wizmote_mac_address).state.c_str()']

switch:
  - platform: template
    name: "WizMote Auto-Discovery"
    id: wizmote_discovery_mode
    icon: "mdi:radar"
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(wizmote_status).update();'
    on_turn_off:
      - lambda: 'id(wizmote_status).update();'

text_sensor:
  - platform: template
    name: "WizMote Status"
    id: wizmote_status
    icon: "mdi:remote"
    entity_category: diagnostic
    lambda: |-
      std::string mac = id(wizmote_mac_address).state;
      if (id(wizmote_discovery_mode).state)
        return std::string("Discovery on: press any button on the remote");
      if (mac == "00:00:00:00:00:00" || mac == "")
        return std::string("No remote paired");
      return std::string("Paired: " + mac);
    update_interval: 300s
