# WizMote remote support. Adapted from hub75-studio's packages/common/wizmote.yaml
# (MIT, Stuart Parmenter): same ESP-NOW pairing and brightness handling, but the
# four numbered buttons pick favorite teams instead of pages.
#
# Buttons: ON/OFF = panel power, 1-4 = what the owner set each to (a favorite,
# a playlist, a sport row, all favorites, Live games or nothing; or a page
# under Showing: Scoreboard, Clock, Smart board, or Effects with an effect of
# its own; its own favorite until then, set_request.h RemoteTarget),
# brightness up/down, NIGHT = dim to the night level. In the demo build 1-4 run the demo instead (remote_number in
# components/gameday/demo.cpp).
#
# While the night schedule has the panel dim or dark, ON, Brighter, NIGHT and
# 1-4 turn it off for the rest of the night (night_skip in the gameday
# component), and NIGHT turns it back on. Dimmer leaves the night alone:
# the panel is already as dim as the owner set it.

substitutions:
  WIZMOTE_MAC_ADDRESS: "00:00:00:00:00:00"
  WIZMOTE_BRIGHTNESS_STEP: "10"
  WIZMOTE_BRIGHTNESS_MIN_STEP: "5"
  WIZMOTE_BRIGHTNESS_NIGHT: "20"

globals:
  - id: wizmote_last_sequence
    type: int
    initial_value: '0'
  - id: wizmote_previous_mac
    type: std::string
    initial_value: '""'

script:
  - id: process_wizmote_button
    parameters:
      button: int
    then:
      - if:
          condition:
            lambda: 'return button >= 16 && button <= 19;'
          then:
            # A numbered button on a dark panel is somebody asking to see something.
            - lambda: 'id(gameday_ctl).night_skip("the remote");'
            - if:
                condition:
                  lambda: 'return !id(gameday_ctl).display_on();'
                then:
                  - light.turn_on: gd_display
            - lambda: 'id(gameday_ctl).remote_number(button - 15);'
      - if:
          condition:
            lambda: 'return button == 1;'
          then:
            - lambda: 'id(gameday_ctl).night_skip("the remote");'
            - light.turn_on: gd_display
      - if:
          condition:
            lambda: 'return button == 2;'
          then:
            - light.turn_off: gd_display
      - if:
          # Brighter on a panel that is off, or dim or dark for the night,
          # means turn it on. The first press brings back the brightness it
          # was set to; stepping up as well would jump straight past it.
          condition:
            lambda: 'return button == 9;'
          then:
            - if:
                condition:
                  lambda: 'return id(gameday_ctl).night_skip("the remote") || !id(gameday_ctl).display_on();'
                then:
                  - light.turn_on: gd_display
                else:
                  - lambda: |-
                      float step = std::max((float) ${WIZMOTE_BRIGHTNESS_MIN_STEP}, 255.0f * ${WIZMOTE_BRIGHTNESS_STEP} / 100.0f);
                      id(gameday_ctl).set_display_level(lroundf(id(gameday_ctl).display_level() + step));
      - if:
          # Dimmer does nothing on a panel that is off, or dim or dark for the
          # night. Otherwise mashing it in the dark walks the saved level down
          # to 1, and the next power on comes back as good as invisible.
          condition:
            lambda: 'return button == 8;'
          then:
            - if:
                condition:
                  lambda: 'return id(gameday_ctl).display_on() && !id(gameday_ctl).night_holding();'
                then:
                  - lambda: |-
                      float step = std::max((float) ${WIZMOTE_BRIGHTNESS_MIN_STEP}, 255.0f * ${WIZMOTE_BRIGHTNESS_STEP} / 100.0f);
                      id(gameday_ctl).set_display_level(lroundf(id(gameday_ctl).display_level() - step));
      - if:
          condition:
            lambda: 'return button == 3;'
          then:
            # NIGHT on a dark panel turns it on at the night level: on
            # first, then the brightness. On
            # a night the remote or the page skipped, it goes back to the
            # schedule instead; during the schedule's hours it skips the night
            # too, or the night level would never show.
            - if:
                condition:
                  lambda: 'return id(gameday_ctl).night_skipped();'
                then:
                  - lambda: 'id(gameday_ctl).night_resume();'
                else:
                  - lambda: 'id(gameday_ctl).night_skip("the remote");'
                  - if:
                      condition:
                        lambda: 'return !id(gameday_ctl).display_on();'
                      then:
                        - light.turn_on: gd_display
                  - lambda: 'id(gameday_ctl).set_display_level(${WIZMOTE_BRIGHTNESS_NIGHT});'

gameday:
  on_action:
    # A numbered button asked Showing for a page (remote_number in
    # components/gameday): its own page button, or the Scoreboard after a
    # button that follows a team, playlist or Live games. A page already
    # showing stays; an Effects button puts its effect on first, so the
    # effect from before never flashes up.
    - if:
        condition:
          lambda: 'return x == "remote_page";'
        then:
          - lambda: |-
              using K = ::espn::RemoteKind;
              const K want = (K) id(gameday_ctl).remote_page();
              if (want == K::EFFECTS) {
                const std::string effect = id(gameday_ctl).remote_fx_effect();
                if (!id(gd_fx).set_effect_by_name(effect))
                  ESP_LOGW("wizmote", "Effect %s isn't in this build, so Effects keeps its own", effect.c_str());
                id(gd_fx).engine().set_palette(id(gameday_ctl).remote_fx_palette());
                id(gd_fx).engine().set_speed(id(gameday_ctl).remote_fx_speed());
                id(gd_fx).engine().set_intensity(id(gameday_ctl).remote_fx_intensity());
                id(gd_fx).notify_state_change();
              }
              const char *page = want == K::EFFECTS ? "Effects"
                                 : want == K::CLOCK ? "Clock"
                                 : want == K::SMART ? "Smart board"
                                                    : "Scoreboard";
              const char *page_id = want == K::EFFECTS ? "gd_fx_page"
                                    : want == K::CLOCK ? "page_time_date"
                                    : want == K::SMART ? "gd_sb_page"
                                                       : "gameday_live";
              // current_option() is empty, with a null c_str(), before the first page
              const auto cur = id(page_manager).current_option();
              if (!cur.empty() && strcmp(cur.c_str(), page) == 0) {
                // After the game's Smart board is up, and the button picks
                // it: it stays until somebody picks something else.
                if (want == K::SMART && !id(gd_sb_pinned)) {
                  id(gd_sb_pinned) = true;
                  id(gd_sb_pin_sync).execute();
                }
                return;
              }
              ESP_LOGI("wizmote", "Showing: %s", page);
              id(page_manager).show_page(page_id);

espnow:
  id: espnow_component
  auto_add_peer: false
  enable_on_boot: true
  on_unknown_peer:
    then:
      - lambda: |-
          char mac_str[18];
          snprintf(mac_str, sizeof(mac_str), "%02x:%02x:%02x:%02x:%02x:%02x",
                   info.src_addr[0], info.src_addr[1], info.src_addr[2],
                   info.src_addr[3], info.src_addr[4], info.src_addr[5]);
          std::string sender_mac = mac_str;
          if (size != 13)
            return;
          if (id(wizmote_discovery_mode).state) {
            std::string current_mac = id(wizmote_mac_address).state;
            // The remote repeats each press. Once it is paired the repeats
            // reach on_broadcast, and the press that paired it must not act
            // too (OFF would turn the panel off): take its sequence now.
            id(wizmote_last_sequence) = (data[4] << 24) | (data[3] << 16) | (data[2] << 8) | data[1];
            if (current_mac != sender_mac) {
              ESP_LOGI("wizmote", "Discovered WizMote %s", sender_mac.c_str());
              auto call = id(wizmote_mac_address).make_call();
              call.set_value(sender_mac);
              call.perform();
            }
            id(wizmote_discovery_mode).turn_off();
            return;
          }
          ESP_LOGI("wizmote", "Unpaired WizMote %s pressed a button (turn on discovery to pair)", sender_mac.c_str());
  on_broadcast:
    then:
      - lambda: |-
          if (size != 13)
            return;
          char mac_str[18];
          snprintf(mac_str, sizeof(mac_str), "%02x:%02x:%02x:%02x:%02x:%02x",
                   info.src_addr[0], info.src_addr[1], info.src_addr[2],
                   info.src_addr[3], info.src_addr[4], info.src_addr[5]);
          std::string sender_mac = mac_str;
          std::string configured_mac = id(wizmote_mac_address).state;
          std::transform(configured_mac.begin(), configured_mac.end(), configured_mac.begin(), ::tolower);
          if (configured_mac == "00:00:00:00:00:00" || configured_mac.empty() || sender_mac != configured_mac)
            return;
          // data[1..4] sequence (little endian), data[6] button
          uint32_t sequence = (data[4] << 24) | (data[3] << 16) | (data[2] << 8) | data[1];
          uint8_t button = data[6];
          if ((int) sequence == id(wizmote_last_sequence))
            return;
          id(wizmote_last_sequence) = sequence;
          // Discovery on and the paired remote pressed: it is already paired,
          // so that press ends discovery and does nothing else.
          if (id(wizmote_discovery_mode).state) {
            ESP_LOGI("wizmote", "WizMote %s is already paired", sender_mac.c_str());
            id(wizmote_discovery_mode).turn_off();
            return;
          }
          ESP_LOGI("wizmote", "Button %d", button);
          id(process_wizmote_button).execute(button);

text:
  - platform: template
    name: "WizMote MAC Address"
    id: wizmote_mac_address
    icon: "mdi:remote"
    entity_category: config
    initial_value: "${WIZMOTE_MAC_ADDRESS}"
    optimistic: true
    restore_value: true
    mode: text
    min_length: 17
    max_length: 17
    on_value:
      - lambda: |-
          bool valid = true;
          for (int i = 0; i < 17; i++) {
            if (i % 3 == 2 ? x[i] != ':' : !std::isxdigit((unsigned char) x[i]))
              valid = false;
          }
          if (!valid)
            ESP_LOGW("wizmote", "Invalid MAC %s (expected aa:bb:cc:dd:ee:ff)", x.c_str());
          // Into flash at once: a pairing or an unpair followed by a power cut
          // within ESPHome's 60 s flash timer brought the old remote back.
          id(gameday_ctl).sync_soon();
      - if:
          condition:
            lambda: 'return id(wizmote_previous_mac) != "" && id(wizmote_previous_mac) != "00:00:00:00:00:00";'
          then:
            - espnow.peer.delete:
                address: !lambda |-
                  std::array<uint8_t, 6> mac_bytes{};
                  sscanf(id(wizmote_previous_mac).c_str(), "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
                         &mac_bytes[0], &mac_bytes[1], &mac_bytes[2], &mac_bytes[3], &mac_bytes[4], &mac_bytes[5]);
                  return mac_bytes;
      - if:
          condition:
            lambda: 'return x != "00:00:00:00:00:00" && x != "";'
          then:
            - espnow.peer.add:
                address: !lambda |-
                  std::array<uint8_t, 6> mac_bytes{};
                  sscanf(x.c_str(), "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
                         &mac_bytes[0], &mac_bytes[1], &mac_bytes[2], &mac_bytes[3], &mac_bytes[4], &mac_bytes[5]);
                  return mac_bytes;
            - logger.log:
                format: "WizMote paired: %s"
                args: ['x.c_str()']
      - lambda: 'id(wizmote_previous_mac) = x;'
      - lambda: 'id(wizmote_status).update();'

button:
  - platform: template
    name: "Clear WizMote Pairing"
    id: wizmote_clear_button
    icon: "mdi:close-circle"
    entity_category: config
    on_press:
      - lambda: |-
          std::string mac = id(wizmote_mac_address).state;
          if (mac != "00:00:00:00:00:00" && mac.length() == 17) {
            std::array<uint8_t, 6> mac_bytes{};
            if (sscanf(mac.c_str(), "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
                       &mac_bytes[0], &mac_bytes[1], &mac_bytes[2], &mac_bytes[3], &mac_bytes[4], &mac_bytes[5]) == 6)
              id(espnow_component).del_peer(mac_bytes.data());
          }
          // A call, not publish_state(): only a call saves the value, and an
          // unsaved one brings the old remote back at the next restart.
          auto call = id(wizmote_mac_address).make_call();
          call.set_value("00:00:00:00:00:00");
          call.perform();
      - lambda: 'id(wizmote_status).update();'

esphome:
  on_boot:
    - priority: -200
      then:
        - delay: 2s
        - if:
            condition:
              lambda: |-
                std::string mac = id(wizmote_mac_address).state;
                return mac != "00:00:00:00:00:00" && mac != "";
            then:
              - espnow.peer.add:
                  address: !lambda |-
                    std::array<uint8_t, 6> mac_bytes{};
                    sscanf(id(wizmote_mac_address).state.c_str(), "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
                           &mac_bytes[0], &mac_bytes[1], &mac_bytes[2], &mac_bytes[3], &mac_bytes[4], &mac_bytes[5]);
                    return mac_bytes;
              - logger.log:
                  format: "WizMote pairing restored: %s"
                  args: ['id(wizmote_mac_address).state.c_str()']

switch:
  - platform: template
    name: "WizMote Auto-Discovery"
    id: wizmote_discovery_mode
    icon: "mdi:radar"
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(wizmote_status).update();'
    on_turn_off:
      - lambda: 'id(wizmote_status).update();'

text_sensor:
  - platform: template
    name: "WizMote Status"
    id: wizmote_status
    icon: "mdi:remote"
    entity_category: diagnostic
    lambda: |-
      std::string mac = id(wizmote_mac_address).state;
      if (id(wizmote_discovery_mode).state)
        return std::string("Discovery on: press any button on the remote");
      if (mac == "00:00:00:00:00:00" || mac == "")
        return std::string("No remote paired");
      return std::string("Paired: " + mac);
    update_interval: 300s
