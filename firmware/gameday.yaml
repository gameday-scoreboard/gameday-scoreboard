# Game Day Scoreboard for a HUB75 matrix on the MoonHub75 pinout. One firmware
# for one 64x64 panel or two side by side: the panel count is picked on the
# device page and applied at boot (components/panel_layout).
substitutions:
  variant: "moonhub75"

packages:
  controller: !include controllers/moonhub75.yaml
  common: !include gameday-common.yaml

# TRACE BUILD ONLY (backlog #84): find the task that overflows its stack when
# QC runs with /events open. Never merges.
esp32:
  framework:
    # 16 KB so the trace can measure the loop task's real peak (8 KB overflows)
    advanced:
      loop_task_stack_size: 16384
    sdkconfig_options:
      CONFIG_FREERTOS_USE_TRACE_FACILITY: y

esphome:
  includes:
    - stack_trace.h
  on_boot:
    priority: 600
    then:
      - lambda: trace_report_overflow();

interval:
  - interval: 1s
    then:
      - lambda: trace_stack_marks(30);
  - interval: 15s
    then:
      - lambda: trace_report_overflow();
