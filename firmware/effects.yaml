# Effects mode: WLED's 2D effects (bharvey88/esphome-wled-fx) full screen in
# place of the scoreboard. wled_fx needs the display handed over to it, so
# while the Effects switch is on it draws every frame straight into the HUB75
# display and LVGL is paused; switching off hands the screen back and repaints
# the scoreboard. The scoreboard keeps polling ESPN underneath.

external_components:
  # Branch hub75-rgb565: hands a hub75 display RGB565 when LVGL is in the build.
  - source: github://bharvey88/esphome-wled-fx@16df2b72d91214131451957ddd0f6d28fe5134df
    components: [wled_fx]

wled_fx:
  id: gd_fx
  display_id: matrix
  # Allow-list: every 2D effect a matrix offers except the twelve audio
  # reactive ones, which animate to simulated sound without an audio block.
  effects:
    - Matrix
    - Metaballs
    - Scrolling Text
    - Black Hole
    - Colored Bursts
    - DNA
    - DNA Spiral
    - Drift
    - Firenoise
    - Frizzles
    - Game Of Life
    - Hiphotic
    - Julia
    - Lissajous
    - Noise2D
    - Plasma Ball
    - Polar Lights
    - Pulser
    - Sindots
    - Squared Swirl
    - Sun Radiation
    - Tartan
    - Spaceships
    - Crazy Bees
    - Ghost Rider
    - Blobs
    - Drift Rose
    - Rotozoomer
    - Distortion Waves
    - Soap
    - Octopus
    - Waving Cell
    - Fireworks
    - Rain
    - Ripple
    - Ripple Rainbow
    - Palette
    - Halloween Eyes
    - Fireworks 1D
    - PS Fire
    - PS Fireworks
    - PS Vortex
    - PS Volcano
    - PS Ballpit
    - PS Waterfall
    - PS Box
    - PS Fuzzy Noise
    - PS Impact
    - PS Attractor
    - PS Ghost Rider
    - PS Galaxy
    - Snow Fall
  effect: Matrix
  text: "GAME DAY"
  update_interval: 23ms
  # The hub75 driver keeps its CIE1931 curve for the scoreboard, so wled_fx
  # must not add gamma 2.2 on top of it.
  gamma_correct: 1.0
  # Internal RAM is what the HTTPS fetches run out of on this panel, so the
  # canvas and frame buffer stay in PSRAM.
  canvas_memory: psram
  # Leave the main loop tick alone while effects are off; the switch below
  # shortens it only while an effect runs.
  loop_interval: never

globals:
  - id: gd_fx_boot_done
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: gd_fx_saved_loop_ms
    type: int
    restore_value: no
    initial_value: '16'

esphome:
  on_boot:
    # wled_fx sets up at LATE (-100). Park its loop so an idle panel never
    # renders a frame, then let the switch actions run.
    - priority: -200.0
      then:
        - lambda: |-
            id(gd_fx).disable_loop();
            id(gd_fx_boot_done) = true;

switch:
  - platform: template
    name: "Effects"
    id: gd_effects
    icon: "mdi:auto-fix"
    optimistic: true
    # Always back on the scoreboard after a reboot.
    restore_mode: ALWAYS_OFF
    turn_on_action:
      # The off action also fires during this switch's own setup, before LVGL
      # and wled_fx exist; the on_boot step above lifts the guard. `state` is
      # still the old value inside these actions (a template switch publishes
      # after them), so the second test skips a repeated turn_on, which would
      # otherwise save the 8 ms tick as the one to restore. A wled_fx that
      # failed setup (no canvas) must not take the screen.
      - if:
          condition:
            lambda: 'return id(gd_fx_boot_done) && !id(gd_effects).state && !id(gd_fx).is_failed();'
          then:
            - lvgl.pause:
            - lambda: |-
                // ESPHome's 16 ms tick rounds a 23 ms frame up to 32 ms. Ask
                // for a shorter tick only while an effect runs.
                id(gd_fx_saved_loop_ms) = App.get_loop_interval();
                App.set_loop_interval(8);
                id(gd_fx).reset_frame_clock();
                // Start a fresh profiler window; wled_fx only restarts it on
                // an effect change.
                id(gd_fx).reset_profile(millis());
                id(gd_fx).enable_loop();
    turn_off_action:
      - if:
          condition:
            lambda: 'return id(gd_fx_boot_done) && id(gd_effects).state;'
          then:
            - lambda: |-
                id(gd_fx).disable_loop();
                App.set_loop_interval(id(gd_fx_saved_loop_ms));
            - lvgl.resume:
            # LVGL marked nothing dirty while paused, so the whole scoreboard
            # must be redrawn over the last effect frame.
            - script.execute: gd_repaint

select:
  - platform: wled_fx
    wled_fx_id: gd_fx
    type: effect
    name: "Effect"
    icon: "mdi:animation-play"
  - platform: wled_fx
    wled_fx_id: gd_fx
    type: palette
    name: "Effect Palette"
    icon: "mdi:palette"

number:
  - platform: wled_fx
    wled_fx_id: gd_fx
    type: speed
    name: "Effect Speed"
    icon: "mdi:speedometer"
  - platform: wled_fx
    wled_fx_id: gd_fx
    type: intensity
    name: "Effect Intensity"
    icon: "mdi:tune"

sensor:
  - platform: template
    name: "Effect FPS"
    id: gd_fx_fps
    icon: "mdi:film"
    unit_of_measurement: "fps"
    accuracy_decimals: 1
    state_class: measurement
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      if (!id(gd_effects).state || id(gd_fx).profile().frames == 0) return NAN;
      return id(gd_fx).profile().fps_x10() / 10.0f;
  # Template sensors gated on the switch, so all three read NA while Effects
  # is off, and during wled_fx's one second warm-up after an effect change,
  # when its averages are still zero.
  - platform: template
    name: "Effect Render Time"
    id: gd_fx_render_time
    icon: "mdi:timer-outline"
    unit_of_measurement: "µs"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      if (!id(gd_effects).state || id(gd_fx).profile().frames == 0) return NAN;
      return id(gd_fx).profile().render_avg_us();
  - platform: template
    name: "Effect Output Time"
    id: gd_fx_output_time
    icon: "mdi:timer-outline"
    unit_of_measurement: "µs"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      if (!id(gd_effects).state || id(gd_fx).profile().frames == 0) return NAN;
      return id(gd_fx).profile().output_avg_us();
