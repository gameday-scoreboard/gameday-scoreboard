# Bar build for the Game Day Scoreboard controller board: gameday-scoreboard75.yaml plus the bar package
# (pages/bar.yaml). For panels in bars. It updates only from the bar releases
# (install.gameday-scoreboard.com/firmware/<variant>-bar/), published with
# every release, or with Follow beta on from the bar betas
# (firmware/beta/<variant>/), published from the beta branch.
substitutions:
  update_source: "https://install.gameday-scoreboard.com/firmware/${variant}-bar/manifest.json"
  beta_update_source: "https://install.gameday-scoreboard.com/firmware/beta/${variant}/manifest.json"
  bar_report_email: "support@gameday-scoreboard.com"

packages:
  base: !include gameday-scoreboard75.yaml
  bar: !include pages/bar.yaml
