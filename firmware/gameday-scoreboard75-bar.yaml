# Bar build for the Game Day Scoreboard controller board:
# gameday-scoreboard75.yaml plus the beta channel (pages/bar.yaml). For the
# free panels in bars only; CI publishes it to the beta channel from the beta
# branch, never to the flasher or the release manifest.
substitutions:
  update_source: "https://install.gameday-scoreboard.com/firmware/beta/${variant}/manifest.json"
  bar_report_email: "support@gameday-scoreboard.com"

packages:
  base: !include gameday-scoreboard75.yaml
  bar: !include pages/bar.yaml
